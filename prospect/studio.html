<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>prospect — model studio</title>
<!--
  Not part of the site. This is the studio the desk model was photographed in.

  The object on the desk is a still image, because a 3D engine on the cube
  for one object nobody has picked up yet would be the heaviest thing on the
  page. The image is rendered here, once, with physical materials and lit from
  the same place as the bulb in the prospect room, so the object and the room
  share one light. Run it again whenever the model changes:

    Chrome --headless=new --use-angle=metal --virtual-time-budget=8000
           --dump-dom 'http://127.0.0.1:4173/prospect/studio.html?id=<product>'
  then decode the two data URLs it prints into prospect/<product>/objet.png and shadow.png
  (test/tools/render-objet.py does exactly that).

  Two passes, same camera, same frame: the object alone, and its shadow alone.
  They are stacked on the desk, and kept apart so that picking the object up
  can lift it off a shadow that stays on the floor.
-->
<style>html,body{margin:0;background:#888}canvas{display:block}</style>
</head><body>
<pre id="out" style="display:none"></pre>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 1800, H = 1140;   // twice what the reel shows it at, for a 2x screen
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;   // honours shadow.radius; Soft ignores it
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
/* The studio. Not a room: a grey void with softboxes in it, which is what a
   product is photographed in. White and silver only have a shape where they
   reflect something that changes — under an even white sky they come out as
   paper cut-outs — so the surroundings are mid grey and the light comes from
   a few long bright panels that leave streaks along every curved edge. */
const studio = new THREE.Scene();
studio.background = new THREE.Color(0x4b4e55);
const softbox = (w, h, x, y, z, power, tint = 0xffffff) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(tint).multiplyScalar(power), side: THREE.DoubleSide }));
  m.position.set(x, y, z); m.lookAt(0, 0, 0); studio.add(m);
};
softbox(9, 4, 0, 7, 2.5, 7);                 // overhead, the key
softbox(1.6, 9, -7.5, 1.5, 3, 5.5);          // a tall strip, camera left
softbox(1.2, 7, 7.5, 2.5, 0.5, 3.2, 0xeaf1ff);  // a cooler one, right
softbox(12, 1, 0, 1.2, -9, 2.2);             // a horizon line behind
softbox(24, 24, 0, -5, 0, 1.5, 0xf6f4f0);    // the floor bouncing back up
const env = pmrem.fromScene(studio, 0.015).texture;
scene.environment = env;
scene.environmentIntensity = 1;

const camera = new THREE.PerspectiveCamera(24, W / H, 1, 2000);
// a product shot: square on, a little above, the way a lineup is photographed
camera.position.set(0, 120, 520);
camera.lookAt(0, 18, -40);

/* One light that is not in the reflections: from above and a little in
   front, for the shadow under the object and the top-down falloff. */
const bulb = new THREE.DirectionalLight(0xfff6ea, 1.05);
bulb.position.set(30, 420, 150);
bulb.target.position.set(0, 0, 0);
bulb.castShadow = true;
bulb.shadow.mapSize.set(2048, 2048);
Object.assign(bulb.shadow.camera, { left: -240, right: 240, top: 240, bottom: -240, near: 1, far: 1200 });
bulb.shadow.radius = 22;
bulb.shadow.bias = -0.0005;
scene.add(bulb, bulb.target);

// ---- the models ------------------------------------------------------------
/* One studio, every product: ?id=<product> picks the model. They share the
   light, the camera and the finish — white ceramic, brushed silver, a little
   glass: cogspect's own surfaces — which is what makes three unrelated
   objects read as one range. */
const id = new URLSearchParams(location.search).get('id') || 'glasspect';
/* envMap is given directly: with only scene.environment set, a material's
   envMapIntensity is ignored (three r169). */
const mat = (o) => { const m = new THREE.MeshPhysicalMaterial(o); m.envMap = env; return m; };
const ceramic = mat({ color: 0xe9e9e7, roughness: 0.16, clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 1.05 });
const matte = mat({ color: 0xe9e9e7, roughness: 0.62, sheen: 0.4, sheenRoughness: 0.5, envMapIntensity: 0.8 });
const silver = mat({ color: 0xd9dce1, metalness: 1, roughness: 0.2, envMapIntensity: 1.15 });
const satin = mat({ color: 0xc9ccd2, metalness: 1, roughness: 0.42, envMapIntensity: 1.1 });
const lensGlass = mat({ color: 0xb7cde0, roughness: 0.02, clearcoat: 1, clearcoatRoughness: 0.01, transparent: true,
  opacity: 0.3, iridescence: 0.9, iridescenceIOR: 1.45, iridescenceThicknessRange: [240, 520], envMapIntensity: 2.2,
  side: THREE.DoubleSide });
const clearShell = mat({ color: 0xdbe6ee, roughness: 0.04, clearcoat: 1, clearcoatRoughness: 0.02, transparent: true,
  opacity: 0.34, envMapIntensity: 2, depthWrite: false });
const blackGlass = mat({ color: 0x090a0e, roughness: 0.03, clearcoat: 1, clearcoatRoughness: 0.01, envMapIntensity: 1.5 });
const smoke = mat({ color: 0x141920, roughness: 0.04, clearcoat: 1, clearcoatRoughness: 0.01, transparent: true,
  opacity: 0.93, envMapIntensity: 1.7, side: THREE.DoubleSide });
const rubber = mat({ color: 0x15161a, roughness: 0.78, envMapIntensity: 0.6 });
const glow = (c, o = 1) => new THREE.MeshBasicMaterial({ color: c, transparent: o < 1, opacity: o,
  side: THREE.DoubleSide, depthWrite: o >= 1, toneMapped: false });

const model = new THREE.Group();
const put = (parent, geo, m, x = 0, y = 0, z = 0, shadow = true) => {
  const mesh = new THREE.Mesh(geo, m); mesh.position.set(x, y, z); mesh.castShadow = shadow; parent.add(mesh); return mesh; };
const add = (geo, m, x, y, z, shadow) => put(model, geo, m, x, y, z, shadow);

/* A rounded quadrilateral, wider at the top than the bottom when wt > wb. */
function rim(wt, wb, h, r, path = new THREE.Shape()) {
  const pts = [[-wt, h], [wt, h], [wb, -h], [-wb, -h]];
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const [px, py] = pts[i], [ax, ay] = pts[(i + n - 1) % n], [bx, by] = pts[(i + 1) % n];
    const la = Math.hypot(ax - px, ay - py), lb = Math.hypot(bx - px, by - py);
    const sx = px + (ax - px) / la * r, sy = py + (ay - py) / la * r;
    const ex = px + (bx - px) / lb * r, ey = py + (by - py) / lb * r;
    if (i === 0) path.moveTo(sx, sy); else path.lineTo(sx, sy);
    path.quadraticCurveTo(px, py, ex, ey);
  }
  path.closePath();
  return path;
}
const slab = (shape, depth, bevel, seg = 6) => new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0,
  bevelThickness: bevel, bevelSize: bevel, bevelSegments: seg, curveSegments: 48 });
/* A surface from a function: P(u, v) -> [x, y, z], sampled on a grid. Used
   where an extrusion would show its flat sides — a car body is not a
   profile pushed sideways. */
function loft(P, nu, nv) {
  const pos = [], idx = [];
  for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) pos.push(...P(i / nu, j / nv));
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    const a = i * (nv + 1) + j, b = a + 1, c = a + nv + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
const two = (m) => { const c = m.clone(); c.envMap = env; c.side = THREE.DoubleSide; return c; };

const BUILD = {
  /* glasspect: an everyday horn-rimmed pair, and nothing about the front
     says otherwise. White ceramic rims, clear coated lenses; the computer is
     in the front third of each temple, under glass. */
  glasspect() {
    const g = new THREE.Group();
    for (const side of [-1, 1]) {
      const cx = side * 33.5;
      const outer = rim(27.6, 24.6, 21.4, 12.5);
      outer.holes.push(rim(24.4, 21.5, 18.3, 10, new THREE.Path()));
      const fr = slab(outer, 3.4, 1.15, 8); fr.translate(cx, 0, -1.7);
      put(g, fr, ceramic);
      const ln = slab(rim(24.7, 21.8, 18.6, 10.2), 0.9, 0.35, 3); ln.translate(cx, 0, -0.45);
      put(g, ln, lensGlass, 0, 0, 0, false);
      // end piece, out from the top corner to the hinge
      put(g, new RoundedBoxGeometry(8.5, 8.6, 5.4, 4, 2), ceramic, side * 62.6, 12.6, -1.2);
      const pin = put(g, new THREE.CylinderGeometry(1.5, 1.5, 9.4, 20), silver, side * 66.2, 12.6, -4.2);
      void pin;
      // a camera no larger than a rivet, where a rivet would be
      const eye = put(g, new THREE.CylinderGeometry(1.7, 1.7, 0.8, 24), blackGlass, side * 57.2, 14.2, 2.9, false);
      eye.rotation.x = Math.PI / 2;
      const ring = put(g, new THREE.TorusGeometry(1.9, 0.32, 8, 32), silver, side * 57.2, 14.2, 3.1, false);
      void ring;
      // nose pad, clear, on a silver arm
      const pad = put(g, new THREE.SphereGeometry(3.2, 24, 16), clearShell, side * 9.2, -8.5, -6.5, false);
      pad.scale.set(0.55, 1.25, 0.8); pad.rotation.z = side * 0.3;
      /* The temple, drawn from the side and given its thickness: straight
         back, then down behind the ear. */
      const t = new THREE.Shape();
      t.moveTo(0, 17); t.lineTo(-44, 16.4); t.lineTo(-96, 15.2);
      t.quadraticCurveTo(-118, 14.4, -131, -3.5);
      t.quadraticCurveTo(-134, -8.5, -129, -8.6);
      t.quadraticCurveTo(-125.5, -8.4, -122, -3);
      t.quadraticCurveTo(-110, 10.6, -94, 10.6);
      t.lineTo(-44, 9.4); t.lineTo(0, 8.2); t.closePath();
      const arm = slab(t, 2.6, 0.9, 5); arm.translate(0, 0, -1.3); arm.rotateY(-Math.PI / 2);
      const temple = new THREE.Group();
      put(temple, arm, ceramic);
      // the module: a silver core you can see through the glass around it
      put(temple, new RoundedBoxGeometry(3.2, 6.4, 36, 4, 1.4), satin, 0, 12.6, -25);
      put(temple, new RoundedBoxGeometry(6.4, 10.6, 40, 5, 2.6), clearShell, 0, 12.6, -25, false);
      put(temple, new RoundedBoxGeometry(6.6, 0.7, 14, 2, 0.3), glow(0xffffff, 0.9), 0, 18.1, -22, false);
      temple.position.set(side * 67.4, 0, -6.4);
      temple.rotation.y = side * -0.045;
      g.add(temple);
    }
    // keyhole bridge
    put(g, new THREE.TorusGeometry(7.6, 1.75, 14, 36, Math.PI), ceramic, 0, 7.6, 0);
    put(g, new RoundedBoxGeometry(13, 2.6, 2.8, 3, 1.2), ceramic, 0, 15.6, 0);
    // put down the way a pair is put down: on its lower rims and arm ends
    g.rotation.x = -0.118;
    model.add(g);
    model.rotation.y = 0.5;
    model.scale.setScalar(1.12);
  },

  /* eddwatch: a silver case on a closed white band, standing the way a watch
     stands in a shop window, leaning back; and edd, a small bright body
     turning in the light that rises from the glass. */
  eddwatch() {
    const g = new THREE.Group();
    const RY = 45, RZ = 33, T = 3.4, BW = 27;
    const ring = new THREE.Shape(); ring.absellipse(0, 0, RZ, RY, 0, Math.PI * 2);
    const hole = new THREE.Path(); hole.absellipse(0, 0, RZ - T, RY - T, 0, Math.PI * 2, true);
    ring.holes.push(hole);
    const band = slab(ring, BW, 1.1, 5); band.translate(0, 0, -BW / 2); band.rotateY(-Math.PI / 2);
    put(g, band, matte);
    // the keeper and the pin holes: the two things that make a strap a strap
    const head = new THREE.Group();
    head.position.set(0, 0, RZ + 1.5);
    const body = slab(rim(20, 20, 24, 12.5), 7.4, 1.9, 10); body.translate(0, 0, -5.6);
    put(head, body, silver);
    const glass = slab(rim(18.2, 18.2, 22.2, 11), 0.9, 1.5, 10); glass.translate(0, 0, 3.4);
    put(head, glass, blackGlass, 0, 0, 0, false);
    // what the screen is showing
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 640;
    const x = cv.getContext('2d');
    x.clearRect(0, 0, 512, 640);
    x.fillStyle = 'rgba(255,255,255,.92)'; x.textAlign = 'center';
    x.font = '600 58px -apple-system, "Helvetica Neue", Arial'; x.fillText('10:09', 256, 132);
    const gr = x.createLinearGradient(120, 220, 392, 500);
    gr.addColorStop(0, '#7fd0ff'); gr.addColorStop(0.5, '#6f8cff'); gr.addColorStop(1, '#c08bff');
    x.strokeStyle = gr; x.lineWidth = 22; x.lineCap = 'round';
    x.beginPath(); x.arc(256, 360, 118, -Math.PI * 0.5, Math.PI * 1.15); x.stroke();
    x.strokeStyle = 'rgba(255,255,255,.16)'; x.lineWidth = 22;
    x.beginPath(); x.arc(256, 360, 118, Math.PI * 1.15, Math.PI * 1.5); x.stroke();
    const core = x.createRadialGradient(256, 360, 4, 256, 360, 74);
    core.addColorStop(0, 'rgba(210,232,255,1)'); core.addColorStop(0.45, 'rgba(120,160,255,.55)'); core.addColorStop(1, 'rgba(120,160,255,0)');
    x.fillStyle = core; x.beginPath(); x.arc(256, 360, 74, 0, Math.PI * 2); x.fill();
    x.fillStyle = 'rgba(255,255,255,.7)'; x.font = '500 34px -apple-system, "Helvetica Neue", Arial';
    x.fillText('edd', 256, 566);
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    put(head, new THREE.PlaneGeometry(32, 40), new THREE.MeshBasicMaterial({ map: tex, transparent: true,
      toneMapped: false, depthWrite: false }), 0, 0, 6, false);
    // crown and the button under it
    const crown = put(head, new THREE.CylinderGeometry(3.3, 3.3, 4.2, 28), satin, 22.6, 8.5, -1.8);
    crown.rotation.z = Math.PI / 2;
    put(head, new THREE.TorusGeometry(3.3, 0.5, 8, 28), silver, 24.6, 8.5, -1.8).rotation.y = Math.PI / 2;
    put(head, new RoundedBoxGeometry(2, 11, 3.4, 3, 0.9), satin, 21.4, -8.5, -1.8);
    /* edd. A hologram cannot be drawn as light on a white page — added light
       on white is white — so it is drawn as tinted glass: a faint beam
       opening from the screen and a small body turning in it. */
    const beam = put(head, new THREE.CylinderGeometry(15, 8, 44, 64, 1, true), glow(0x86b4ff, 0.1), 0, -2, 28.5, false);
    beam.rotation.x = Math.PI / 2;
    put(head, new THREE.TorusGeometry(8.2, 0.35, 8, 64), glow(0x6f9dff, 0.55), 0, -2, 6.6, false);
    put(head, new THREE.TorusGeometry(15, 0.3, 8, 80), glow(0x6f9dff, 0.3), 0, -2, 50.5, false);
    const edd = mat({ color: 0xdbe8ff, roughness: 0.05, clearcoat: 1, transparent: true, opacity: 0.94,
      iridescence: 1, iridescenceIOR: 1.7, iridescenceThicknessRange: [220, 560],
      emissive: 0x6c9cff, emissiveIntensity: 0.4, envMapIntensity: 2 });
    put(head, new THREE.SphereGeometry(6.4, 48, 32), edd, 0, -2, 36, false);
    const o1 = put(head, new THREE.TorusGeometry(10.5, 0.42, 8, 80), glow(0x5a8cff, 0.75), 0, -2, 36, false);
    o1.rotation.set(1.25, 0.2, 0);
    const o2 = put(head, new THREE.TorusGeometry(13.5, 0.3, 8, 80), glow(0x9a86ff, 0.5), 0, -2, 36, false);
    o2.rotation.set(0.5, 1.0, 0.3);
    g.add(head);
    g.rotation.x = -0.4;
    model.add(g);
    model.rotation.y = 0.62;
    model.scale.setScalar(1.18);
  },

  /* harnesspect: one volume, nose to tail, with no line on it that is not
     needed. White body, a single canopy of dark glass, covered wheels, and a
     blade of light around each end. */
  harnesspect() {
    const L = 118, Wd = 45;
    const ends = (u) => Math.pow(Math.max(0, 1 - Math.pow(Math.abs(2 * u - 1), 9)), 1 / 9);
    const roof = (u) => { const t = Math.min(1, Math.max(0, (u - 0.05) / 0.84)); return Math.pow(Math.sin(Math.PI * t), 0.8); };
    const sq = (v, n) => Math.sign(v) * Math.pow(Math.abs(v), 2 / n);
    const S = (u, th, off = 0) => {
      const e = ends(u);
      const x = (u - 0.5) * 2 * L;
      const yb = 7.5 + 4 * (1 - e);
      const yt = yb + (25 + 26 * roof(u)) * Math.pow(e, 0.5);
      const yc = (yb + yt) / 2, hh = (yt - yb) / 2;
      const c = Math.cos(th), s = Math.sin(th);
      let z = Wd * Math.pow(e, 0.32) * sq(c, s > 0 ? 3.4 : 7);
      const y = yc + hh * sq(s, s > 0 ? 2.5 : 5);
      if (s > 0) z *= 1 - 0.3 * Math.pow(s, 1.6);          // the cabin leans in toward the roof
      if (!off) return [x, y, z];
      const dy = y - yc, n = Math.hypot(dy, z) || 1;
      return [x, y + dy / n * off, z + z / n * off];
    };
    const lerp = (a, b, t) => a + (b - a) * t;
    // seam under the car, where nobody looks
    add(loft((u, v) => S(0.002 + u * 0.996, -Math.PI / 2 + v * Math.PI * 2), 220, 120), two(ceramic));
    // the canopy: shorter at the roof than at the belt, so both screens rake
    const d2r = Math.PI / 180;
    add(loft((s, t) => {
      const th = lerp(13 * d2r, 167 * d2r, t), f = Math.pow(Math.sin(th), 1.1);
      return S(lerp(0.17 + 0.07 * f, 0.81 - 0.1 * f, s), th, 0.55);
    }, 160, 120), two(blackGlass), 0, 0, 0, false);
    // blades of light: warm white round the nose, red round the tail
    for (const side of [0, 1]) {
      const th = (v) => side ? Math.PI - lerp(2, 5.4, v) * d2r : lerp(2, 5.4, v) * d2r;
      add(loft((s, v) => S(lerp(0.865, 0.9975, s), th(v), 0.5), 60, 4), glow(0xfff4d6), 0, 0, 0, false);
      add(loft((s, v) => S(lerp(0.0025, 0.12, s), th(v), 0.5), 60, 4), glow(0xff4a3c), 0, 0, 0, false);
      // a silver sill between the wheels
      const ts = (v) => side ? Math.PI + lerp(24, 31, v) * d2r : -lerp(24, 31, v) * d2r;
      add(loft((s, v) => S(lerp(0.3, 0.7, s), ts(v), 0.45), 40, 4), two(satin), 0, 0, 0, false);
    }
    // wheels: tyre, a dark well around it, and a closed aero cover
    const WR = 16, AX = 64;
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const w = new THREE.Group();
      const part = (geo, m, z, shadow = true) => { const mesh = put(w, geo, m, 0, 0, z, shadow); mesh.rotation.x = Math.PI / 2; return mesh; };
      // the arch: a dark crescent on the body over the wheel, not a tub —
      // a tub showed under the floor as a second, fatter tyre
      put(w, new THREE.RingGeometry(WR - 2, WR + 2.4, 64, 1, 0, Math.PI), rubber, 0, 0, 3.6, false).material = two(rubber);
      put(w, new THREE.TorusGeometry(WR - 5.2, 5.2, 20, 72), rubber, 0, 0, 0);            // the tyre
      part(new THREE.CylinderGeometry(WR - 5, WR - 5, 7, 64), rubber, 0);
      part(new THREE.CylinderGeometry(WR - 6.2, WR - 5.4, 2.2, 64), ceramic, 4.6, false); // the cover
      put(w, new THREE.TorusGeometry(WR - 6.4, 0.55, 10, 72), silver, 0, 0, 5.6, false);
      put(w, new THREE.TorusGeometry(6.2, 0.4, 10, 48), satin, 0, 0, 5.75, false);
      part(new THREE.CylinderGeometry(2.6, 2.6, 1.2, 32), silver, 5.9, false);
      w.position.set(sx * AX, WR, sz * (Wd - 4.4));
      if (sz < 0) w.rotation.y = Math.PI;
      model.add(w);
    }
    model.rotation.y = -0.46;
    model.scale.setScalar(0.86);
  }
};
BUILD[id]();
// stood on the floor, whatever it is and however it was turned
model.updateMatrixWorld(true);
const box = new THREE.Box3();
model.traverse((m) => { if (m.isMesh && m.castShadow) box.expandByObject(m); });
model.position.y += 1 - box.min.y;
scene.add(model);
const glasses = model;

// ---- the floor, which exists only to receive a shadow ----
const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000),
  new THREE.ShadowMaterial({ opacity: 0.3, color: 0x2a2620 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = 1;
floor.receiveShadow = true;
scene.add(floor);

const shoot = () => { const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').drawImage(renderer.domElement, 0, 0); return c; };
// pass 1: the object alone
floor.visible = false;
renderer.render(scene, camera);
const objet = shoot();
// pass 2: the shadow alone. The object still casts — the shadow map is drawn
// from the light, not the camera — but writes nothing the camera can see.
floor.visible = true;
glasses.traverse((m) => { if (m.isMesh) { m.material = m.material.clone(); m.material.colorWrite = false; m.material.depthWrite = false; } });
renderer.render(scene, camera);
const shadow = shoot();
/* Cropped to the union of both passes' visible pixels, plus a margin, so the
   pair stays registered — the desk stacks them at the same box. */
let x0 = W, y0 = H, x1 = 0, y1 = 0;
for (const c of [objet, shadow]) {
  const px = c.getContext('2d').getImageData(0, 0, W, H).data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (px[(y * W + x) * 4 + 3] > 6) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
}
const m = 18; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m);
x1 = Math.min(W - 1, x1 + m); y1 = Math.min(H - 1, y1 + m);
const crop = (c) => { const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(c, -x0, -y0); return o.toDataURL('image/png'); };
document.getElementById('out').textContent = JSON.stringify({ objet: crop(objet), shadow: crop(shadow) });
document.title = 'DONE';
</script></body></html>
