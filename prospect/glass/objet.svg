<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" fill="none">
  <!-- The desk model: a pair of glasses lying folded-open on the desk, seen
       from in front and a little above, so the temples run back and away. -->
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f8" stop-opacity=".96"/>
      <stop offset=".48" stop-color="#b3bed2" stop-opacity=".72"/>
      <stop offset="1" stop-color="#717d95" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#32353e"/>
      <stop offset="1" stop-color="#9a9fae"/>
    </linearGradient>
  </defs>
  <path d="M33 60 C38 34 56 21 80 15" stroke="url(#arm)" stroke-width="5" stroke-linecap="round"/>
  <path d="M207 60 C202 34 184 21 160 15" stroke="url(#arm)" stroke-width="5" stroke-linecap="round"/>
  <path d="M24 61 Q24 48 38 48 H202 Q216 48 216 61 V77 Q216 101 190 101 H152 Q135 101 129 87 Q120 75 111 87 Q105 101 88 101 H50 Q24 101 24 77 Z"
        fill="url(#lens)" stroke="#2a2d36" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M42 57 H112" stroke="#fff" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
  <path d="M146 57 H190" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
</svg>
