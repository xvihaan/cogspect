<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>glass — desk model render</title>
<!--
  Not part of the site. This is the studio the desk model was photographed in.

  The object on the desk is a still image, because a 3D engine on the cube
  for one object nobody has picked up yet would be the heaviest thing on the
  page. The image is rendered here, once, with physical materials and lit from
  the same place as the bulb in the prospect room, so the object and the room
  share one light. Run it again whenever the model changes:

    Chrome --headless=new --use-angle=metal --virtual-time-budget=8000
           --dump-dom http://127.0.0.1:4173/prospect/glass/render.html
  then decode the two data URLs it prints into objet.png and shadow.png
  (test/tools/render-objet.py does exactly that).

  Two passes, same camera, same frame: the object alone, and its shadow alone.
  They are stacked on the desk, and kept apart so that picking the object up
  can lift it off a shadow that stays on the floor.
-->
<style>html,body{margin:0;background:#888}canvas{display:block}</style>
</head><body>
<pre id="out" style="display:none"></pre>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 1200, H = 760;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;   // honours shadow.radius; Soft ignores it
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const env = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environment = env;
// a dim room: the environment is only there for reflections, the bulb lights it
scene.environmentIntensity = 0.32;

const camera = new THREE.PerspectiveCamera(24, W / H, 1, 2000);
camera.position.set(-70, 205, 520);
camera.lookAt(-6, 10, -30);

/* ---- the bulb: warm, high and off to the right, level with the object —
   which is where it hangs relative to the corner the glasses sit in. From in
   front it buried the shadow behind the object, where nobody could see it. */
/* Directional, not a spot. The spot's pool landed off to one side of the
   object and its falloff left the glasses themselves nearly unlit; what the
   render needs from the bulb is a direction and a shadow, and the warm pool
   around it is drawn by the room, not here. */
const bulb = new THREE.DirectionalLight(0xffc98a, 3.4);
bulb.position.set(330, 250, -10);
bulb.target.position.set(0, 0, 0);
bulb.castShadow = true;
bulb.shadow.mapSize.set(2048, 2048);
Object.assign(bulb.shadow.camera, { left: -220, right: 220, top: 220, bottom: -220, near: 1, far: 1200 });
bulb.shadow.radius = 16;
bulb.shadow.bias = -0.0005;
scene.add(bulb, bulb.target);
// the room itself bounces a little cool grey back into the shadow side
const fill = new THREE.HemisphereLight(0xdfe3ea, 0x2a2622, 0.42);
scene.add(fill);

// ---- the glasses ----------------------------------------------------------
const frameMat = new THREE.MeshPhysicalMaterial({
  color: 0xc6c9cf, metalness: 1, roughness: 0.3, clearcoat: 0.4, clearcoatRoughness: 0.25 });
const lensMat = new THREE.MeshPhysicalMaterial({
  color: 0x07080b, metalness: 0.15, roughness: 0.04, clearcoat: 1, clearcoatRoughness: 0.02,
  reflectivity: 0.9, iridescence: 0.35, iridescenceIOR: 1.3, iridescenceThicknessRange: [180, 420] });
const padMat = new THREE.MeshPhysicalMaterial({ color: 0x1b1c20, roughness: 0.65 });

function frontShape(s) {
  // two lenses meeting at a bridge, one continuous visor-like outline
  const p = new THREE.Shape();
  const w = 74 * s, h = 26 * s, r = 15 * s, b = 9 * s, bh = 8 * s;
  p.moveTo(-w + r, h);
  p.lineTo(w - r, h);
  p.quadraticCurveTo(w, h, w, h - r);
  p.lineTo(w, -h + r * 1.1);
  p.quadraticCurveTo(w, -h, w - r * 1.6, -h);
  p.lineTo(b + 10 * s, -h);
  p.quadraticCurveTo(b + 2 * s, -h, b, -h + bh);
  p.quadraticCurveTo(0, -h + bh * 1.9, -b, -h + bh);
  p.quadraticCurveTo(-b - 2 * s, -h, -b - 10 * s, -h);
  p.lineTo(-w + r * 1.6, -h);
  p.quadraticCurveTo(-w, -h, -w, -h + r * 1.1);
  p.lineTo(-w, h - r);
  p.quadraticCurveTo(-w, h, -w + r, h);
  return p;
}
const glasses = new THREE.Group();
const frameGeo = new THREE.ExtrudeGeometry(frontShape(1), {
  depth: 7, bevelEnabled: true, bevelThickness: 2.2, bevelSize: 2.2, bevelSegments: 8, curveSegments: 48 });
frameGeo.translate(0, 0, -3.5);
const frame = new THREE.Mesh(frameGeo, frameMat);
const lensGeo = new THREE.ExtrudeGeometry(frontShape(0.93), {
  depth: 2, bevelEnabled: true, bevelThickness: 1.2, bevelSize: 0.8, bevelSegments: 6, curveSegments: 48 });
lensGeo.translate(0, 0, 4.6);
const lens = new THREE.Mesh(lensGeo, lensMat);
glasses.add(frame, lens);
/* No wrap. Bending the extruded front after the fact left its flat caps as a
   handful of long triangles, and on a mirror-dark lens every one of them
   showed as a facet. A flat front reads as glass; a faceted one reads as CG. */
/* The lens is a dark mirror, and what makes it read as glass is what it
   reflects. Given the map directly: with only scene.environment set, the
   scene's own intensity (dimmed above for a dim room) wins and a material's
   envMapIntensity is ignored — which is how the first renders came out as a
   black plate. */
lensMat.envMap = env;
lensMat.envMapIntensity = 1.6;
lensMat.roughness = 0.07;
frameMat.envMap = env;
frameMat.envMapIntensity = 0.9;
// temples, folded open, running back from the hinges
for (const side of [-1, 1]) {
  const arm = new THREE.Mesh(new RoundedBoxGeometry(5.5, 9, 112, 4, 2.4), frameMat);
  arm.position.set(side * 72, 4, -58);
  arm.rotation.y = side * -0.09;
  const tip = new THREE.Mesh(new RoundedBoxGeometry(5.8, 9.4, 26, 4, 2.6), padMat);
  tip.position.set(side * 76.5, 4, -117);
  tip.rotation.y = side * -0.09;
  const hinge = new THREE.Mesh(new RoundedBoxGeometry(9, 12, 10, 4, 3), frameMat);
  hinge.position.set(side * 72, 4, -6);
  glasses.add(arm, tip, hinge);
}
glasses.traverse((m) => { if (m.isMesh) { m.castShadow = true; } });
// lying on the desk the way glasses are put down: arms open, resting on them
// tipped back so the front stands on its lower rim and the arm ends touch
// down behind it — the way a pair of glasses actually sits on a table
glasses.rotation.x = -0.235;
glasses.rotation.y = 0.42;
glasses.position.y = 28;
scene.add(glasses);

// ---- the floor, which exists only to receive a shadow ----
const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000),
  new THREE.ShadowMaterial({ opacity: 0.4, color: 0x1a120a }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = 1;
floor.receiveShadow = true;
scene.add(floor);

const shoot = () => { const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').drawImage(renderer.domElement, 0, 0); return c; };
// pass 1: the object alone
floor.visible = false;
renderer.render(scene, camera);
const objet = shoot();
// pass 2: the shadow alone. The object still casts — the shadow map is drawn
// from the light, not the camera — but writes nothing the camera can see.
floor.visible = true;
glasses.traverse((m) => { if (m.isMesh) { m.material = m.material.clone(); m.material.colorWrite = false; m.material.depthWrite = false; } });
renderer.render(scene, camera);
const shadow = shoot();
/* Cropped to the union of both passes' visible pixels, plus a margin, so the
   pair stays registered — the desk stacks them at the same box. */
let x0 = W, y0 = H, x1 = 0, y1 = 0;
for (const c of [objet, shadow]) {
  const px = c.getContext('2d').getImageData(0, 0, W, H).data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (px[(y * W + x) * 4 + 3] > 6) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
}
const m = 12; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m);
x1 = Math.min(W - 1, x1 + m); y1 = Math.min(H - 1, y1 + m);
const crop = (c) => { const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(c, -x0, -y0); return o.toDataURL('image/png'); };
document.getElementById('out').textContent = JSON.stringify({ objet: crop(objet), shadow: crop(shadow) });
document.title = 'DONE';
</script></body></html>
