<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>cogspect — glass cost bench</title>
<!--
  How much does the liquid-glass treatment actually cost, and can it go on
  every surface?

  OPEN THIS IN A REAL BROWSER. Headless cannot answer the question.

  Under --virtual-time-budget rAF is starved and reports nothing; without it,
  headless reports a synthetic 60fps no matter what you put on the page. The
  `bogus` mode below exists to prove that — a full-screen blur(140px) plus a
  filter on every face, which should destroy any frame budget, comes back at
  16.67ms and zero dropped frames, identical to an empty page. So a headless
  run of this file measures the harness, not the site, and a green result from
  one means nothing at all.

  Opened by hand it is honest: it drives the pointer across the keen bar for
  four seconds and reports real frame times. That is the moment the effect
  works hardest, since every pointer move rewrites --near.

  Modes (?mode=)
    keen    as shipped
    all     the treatment forced onto every glass surface on screen
    heavy   ...plus a full-face panel, an overdose to find the ceiling
    bogus   the control. If this one is NOT slow, the run is not measuring.

  Read `bogus` first. If it says 60fps, throw the whole run away.
-->
<style>
  html,body{margin:0;background:#0e0f13;color:#e8eaf0;
            font:13px/1.6 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
  /* The readout is the point of this page, so it is ON TOP of the site rather
     than 800px below it — the first version put it under the iframe, where a
     four-second measurement looked exactly like a blank page that had hung. */
  #panel{position:fixed;inset:12px auto auto 12px;z-index:9;width:360px;
         background:rgba(14,15,19,.92);border:1px solid #2a2c36;border-radius:14px;
         padding:14px 16px;backdrop-filter:blur(6px)}
  h1{margin:0 0 2px;font-size:14px}
  .sub{color:#8d92a2;font-size:11.5px;margin:0 0 10px}
  #bar{height:4px;border-radius:99px;background:#2a2c36;overflow:hidden;margin:10px 0 8px}
  #fill{height:100%;width:0;background:#5b8cff;transition:width .3s linear}
  pre{font:11.5px/1.5 ui-monospace,Menlo,monospace;margin:0;white-space:pre-wrap}
  .warn{color:#ffb454;margin-top:10px;font-size:11.5px}
  .modes{margin-top:10px;font-size:11.5px}
  .modes a{color:#5b8cff;text-decoration:none;margin-right:9px}
  .modes a.on{color:#fff;text-decoration:underline}
  iframe{width:100vw;height:100vh;border:0;display:block}
</style>
</head><body>
<iframe id="f" src="../index.html"></iframe>
<div id="panel">
  <h1>glass cost — <span id="mode"></span></h1>
  <p class="sub">포인터를 keen 바 위에서 4초간 흔들며 실제 프레임 시간을 잽니다.</p>
  <div id="bar"><div id="fill"></div></div>
  <pre id="out">준비 중…</pre>
  <p class="warn" id="warn"></p>
  <p class="modes">
    <a href="?mode=bogus">bogus</a><a href="?mode=keen">keen</a><a href="?mode=all">all</a><a href="?mode=heavy">heavy</a>
  </p>
</div>
<script>
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const MODE = new URLSearchParams(location.search).get('mode') || 'keen';
const SECONDS = 4;

/* Forces the keen bar's treatment onto every glass surface the page has, so
   the "all" pass measures the worst case we would actually ship: several
   SVG-displaced backdrops on screen at once, all re-filtering as the pointer
   moves. */
const SPREAD = {
  // every glass surface the page has, which is the rollout being asked about
  all: `
    .face-banner, .chat-bar, .ghost-msg, .glass-nav, .toast, .keen-slab {
      --near: 1;
      backdrop-filter: url(#lg-drop) blur(calc(5px + var(--near) * 3px)) saturate(160%) !important;
    }
  `,
  // and a deliberate overdose: the same treatment on a full-face panel, to
  // find where this actually breaks rather than only proving it does not
  /* A control. If a deliberately absurd load does NOT move these numbers,
     the bench is measuring nothing and its verdict is worthless — so this
     mode exists to be slow, and the run is only trustworthy if it is. */
  bogus: `
    .stage::after {
      content: ''; position: fixed; inset: 0; z-index: 999;
      backdrop-filter: blur(140px) saturate(300%) hue-rotate(90deg);
      pointer-events: none;
    }
    .face { filter: blur(3px) drop-shadow(0 0 40px rgba(0,0,0,.4)); }
  `,
  heavy: `
    .face-banner, .chat-bar, .ghost-msg, .glass-nav, .toast, .keen-slab {
      --near: 1;
      backdrop-filter: url(#lg-drop) blur(calc(5px + var(--near) * 3px)) saturate(160%) !important;
    }
    .face.landed::after {
      content: ''; position: absolute; inset: 8%; border-radius: 40px;
      backdrop-filter: url(#lg-drop) blur(8px) saturate(160%);
      pointer-events: none;
    }
  `
};

document.getElementById('mode').textContent = MODE;
for (const a of document.querySelectorAll('.modes a')) {
  if (a.getAttribute('href') === '?mode=' + MODE) a.className = 'on';
}
const say = (t) => { out.textContent = t; };
const progress = (p) => { document.getElementById('fill').style.width = (p * 100) + '%'; };

f.addEventListener('load', async () => {
  const w = f.contentWindow, d = f.contentDocument;
  say('인트로가 끝나기를 기다리는 중…'); progress(.1);
  await wait(2600);
  // land on keen, where the real bar lives
  const key = (k) => w.dispatchEvent(new w.KeyboardEvent('keydown', {key: k, bubbles: true}));
  say('keen 면으로 이동 중…'); progress(.3);
  key('ArrowRight'); await wait(1200);
  key('ArrowRight'); await wait(2200);

  if (SPREAD[MODE]) {
    const st = d.createElement('style');
    st.textContent = SPREAD[MODE];
    d.head.appendChild(st);
    await wait(400);
  }

  const bar = d.getElementById('keenHandle').getBoundingClientRect();
  const frames = [];
  let last = performance.now(), stop = false, t = 0;

  // a pointer that never stops: the worst case for a surface that answers to
  // where the pointer is
  const drive = () => {
    if (stop) return;
    t += 0.09;
    w.dispatchEvent(new w.PointerEvent('pointermove', {
      clientX: bar.left + bar.width * (0.5 + 0.48 * Math.sin(t)),
      clientY: bar.top + bar.height * (0.5 + 0.4 * Math.cos(t * 1.7)),
      bubbles: true
    }));
    requestAnimationFrame(drive);
  };
  const tick = () => {
    if (stop) return;
    const now = performance.now();
    frames.push(now - last);
    last = now;
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(drive);
  requestAnimationFrame(tick);

  say('측정 중…'); 
  for (let i = 0; i < SECONDS * 10; i++) {
    await wait(100);
    progress(.4 + .6 * (i / (SECONDS * 10)));
  }
  stop = true;
  progress(1);

  frames.splice(0, 5);                    // the first frames carry the setup
  frames.sort((a, b) => a - b);
  const at = (q) => frames[Math.min(frames.length - 1, Math.floor(frames.length * q))];
  const mean = frames.reduce((a, b) => a + b, 0) / (frames.length || 1);
  const over = (ms) => frames.filter((v) => v > ms).length;

  // what is actually on screen paying for a filtered backdrop
  const glassy = [...d.querySelectorAll('*')].filter((n) => {
    const cs = w.getComputedStyle(n);
    const bf = cs.backdropFilter || cs.webkitBackdropFilter || '';
    if (bf === 'none' || !bf) return false;
    if (Number(cs.opacity) < 0.02 || cs.visibility === 'hidden') return false;
    const r = n.getBoundingClientRect();
    return r.width > 2 && r.height > 2 && r.bottom > 0 && r.top < 800;
  });
  const svgFiltered = glassy.filter((n) =>
    /url\(/.test(w.getComputedStyle(n).backdropFilter || ''));
  const area = glassy.reduce((a, n) => {
    const r = n.getBoundingClientRect();
    return a + Math.round(r.width * r.height);
  }, 0);

  out.textContent = [
    'mode              ' + MODE + '   dpr ' + w.devicePixelRatio,
    'frames sampled    ' + frames.length + '  over ' + SECONDS + 's',
    '',
    'frame time  mean  ' + mean.toFixed(2) + ' ms   (' + (1000 / mean).toFixed(0) + ' fps)',
    '            p50   ' + at(0.50).toFixed(2) + ' ms',
    '            p95   ' + at(0.95).toFixed(2) + ' ms',
    '            p99   ' + at(0.99).toFixed(2) + ' ms',
    '            worst ' + at(1).toFixed(2) + ' ms',
    'dropped     >20ms ' + over(20) + '   >33ms ' + over(33),
    '',
    'glass surfaces on screen   ' + glassy.length,
    '  of those, SVG-displaced  ' + svgFiltered.length,
    '  total filtered area      ' + (area / 1e6).toFixed(2) + ' Mpx',
    '  ' + glassy.map((n) => '.' + (String(n.className).split(' ')[0] || n.tagName)).join(' ')
  ].join('\n');
  /* The verdict, in the output itself. A headless run of this file reports a
     synthetic 60fps whatever is on the page — proven by `bogus`, which should
     destroy any frame budget and does not — so a green result is only worth
     anything if the control was red. */
  const bad = over(20);
  document.getElementById('warn').textContent = MODE === 'bogus'
    ? (bad > 5
        ? '✓ 대조군이 정상적으로 느립니다 — 이 브라우저에서는 측정이 유효합니다.'
        : '✗ 대조군이 안 느립니다. 이 실행은 프레임을 재고 있지 않으니 버리세요.')
    : (bad > 5
        ? '이 모드에서 프레임이 흘렀습니다. 먼저 bogus로 측정이 유효한지 확인하세요.'
        : '매끄럽습니다. 단, bogus가 느리게 나오는 것을 먼저 확인하세요.');
  document.title = 'DONE ' + MODE;
  // Chrome's --dump-dom fires at load, seconds before this has anything to
  // say, so the result is reported rather than scraped. See benchserver.py.
  try { await fetch('/__bench?data=' + encodeURIComponent(out.textContent)); }
  catch (err) { /* opened by hand, not by the runner */ }
});
</script>
</body></html>
