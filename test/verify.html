<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>cogspect — verification harness</title>
<style>body{font:13px/1.5 ui-monospace,Menlo,monospace;margin:0;padding:12px}
iframe{width:1280px;height:800px;border:1px solid #ddd}
pre{white-space:pre-wrap}</style>
</head>
<body>
<!--
  Drives the real page with synthetic events and asserts the invariants that
  are easy to break: rigid-cube spatial memory, hit-testing through the 3D
  transform, arrival twist, focus containment, and zoom dead zones.

  Run:  python3 -m http.server 4173 --bind 127.0.0.1
        open http://127.0.0.1:4173/test/verify.html
  Headless:
        chrome --headless=new --virtual-time-budget=45000 --dump-dom \
               http://127.0.0.1:4173/test/verify.html
  Note: under Chrome's virtual time CSS transitions do not advance, so
  transforms are read from committed inline styles, and mid-transition frames
  are NOT covered here — check those by eye.
-->
<iframe id="f" src="../index.html"></iframe>
<pre id="out">running…</pre>
<script>
const out=[]; let fails=0;
const log=(s)=>{out.push(s);document.getElementById('out').textContent=out.join('\n');};
const ok=(c,m)=>{log((c?'ok   ':'FAIL ')+m); if(!c) fails++;};
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
/* A harness that dies silently reports "ALL PASS" on however many assertions
   it managed before the exception, which is worse than failing. */
window.addEventListener('error', (e) => { log('HARNESS ERROR: ' + e.message); fails++; });
window.addEventListener('unhandledrejection', (e) => {
  const r = e.reason;
  log('HARNESS ERROR: ' + ((r && (r.stack || r.message)) || r));
  fails++;
});
const f=document.getElementById('f');
const LABELS={front:'cogspect',right:'portfolio',left:'Bifröst',back:'keen',top:'prospect',bottom:'minimalid'};
const NORMAL={front:[0,0,1],back:[0,0,-1],right:[1,0,0],left:[-1,0,0],top:[0,-1,0],bottom:[0,1,0]};

f.addEventListener('load', async () => {
  const w=f.contentWindow, d=f.contentDocument;
  w.addEventListener('error',e=>{log('JS ERROR: '+e.message);fails++;});
  const desc=(el)=>el?`${el.tagName.toLowerCase()}${el.id?'#'+el.id:''}.${(el.className||'').toString().trim().replace(/\s+/g,'.')||'-'}`:'null';
  const key=(k)=>w.dispatchEvent(new w.KeyboardEvent('keydown',{key:k,bubbles:true}));
  const hud=()=>d.getElementById('faceIndicator').textContent;
  const face=(n)=>d.querySelector(`[data-face="${n}"]`);
  const mat=()=>{const s=face('front').style.transform;
    const v=s.slice(s.indexOf('matrix3d(')+9,s.indexOf(')',s.indexOf('matrix3d('))).split(',').map(Number);
    return [[v[0],v[4],v[8]],[v[1],v[5],v[9]],[v[2],v[6],v[10]]];};
  const frontOf=(M)=>{let b='front',bz=-9;for(const k in NORMAL){const n=NORMAL[k];
    const z=M[2][0]*n[0]+M[2][1]*n[1]+M[2][2]*n[2]; if(z>bz){bz=z;b=k;}} return b;};
  const exact=(M)=>M.every(r=>r.every(n=>Math.abs(n-Math.round(n))<1e-6));
  const check=(tag)=>{const M=mat(); ok(exact(M),`${tag}: exact pose`); ok(hud()===LABELS[frontOf(M)],`${tag}: HUD matches geometry`);};
  const clickAt=async(el,x,y)=>{
    el.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:11,clientX:x,clientY:y,bubbles:true}));
    await wait(30);
    el.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:11,clientX:x,clientY:y,bubbles:true}));
    el.dispatchEvent(new w.MouseEvent('click',{bubbles:true,clientX:x,clientY:y}));
    await wait(350);};
  const tileHit=()=>{const t=d.querySelector('.cell--proj'); if(!t) return {};
    const r=t.getBoundingClientRect(); const x=Math.round(r.left+r.width/2), y=Math.round(r.top+r.height/2);
    return {t,x,y,hit:d.elementFromPoint(x,y)};};
  const inertFaces=()=>[...d.querySelectorAll('[data-face]')].filter(e=>e.hasAttribute('inert')).map(e=>e.dataset.face).sort().join(',');
  const scale=()=>parseFloat((d.getElementById('zoomWrap').style.transform.match(/scale\(([\d.]+)\)/)||[,'0'])[1]);

  // A turn started while the entrance glide is still running must not leave
  // the arriving face animating from a different pose than the other five.
  await wait(300);
  log('— rigid during an interrupted paint —');
  key('ArrowRight');
  await wait(0);
  const froms=[...d.querySelectorAll('[data-face]')].map((el)=>{
    const a=el.getAnimations?el.getAnimations():[];
    return a.length?(String(a[0].effect.getKeyframes()[0].transform).match(/matrix3d\([^)]*\)/)||[''])[0]:'';
  }).filter(Boolean);
  ok(froms.length===6,`all six faces are turning (got ${froms.length})`);
  ok(new Set(froms).size===1,`…and all start from the same pose (${new Set(froms).size} distinct)`);
  await wait(1400);
  d.getElementById('homeBtn').click();

  await wait(1600);
  log('\n— rigid cube —');
  ok(hud()==='cogspect','boots on cogspect'); check('boot');
  ok(d.getElementById('cube').getBoundingClientRect().width>200,'cube box not degenerate at home');
  ok(inertFaces()==='back,bottom,left,right,top','only the visible face is focusable');

  key('ArrowRight'); await wait(1300); ok(hud()==='portfolio','right → portfolio');
  ok(d.getElementById('cube').getBoundingClientRect().width>200,'cube box not degenerate on a 90° pose');
  key('ArrowUp');   await wait(1300); ok(hud()==='prospect','up → prospect');
  key('ArrowDown'); await wait(1300); ok(hud()==='portfolio','down → the SAME portfolio face');
  key('ArrowLeft'); await wait(1300); ok(hud()==='cogspect','left → home again');
  check('after lap');

  log('\n— arrival twist is applied while the face is edge-on —');
  key('ArrowUp'); await wait(1300);          // now on prospect; next right turn twists a face
  // Read the running transition's own keyframes. Comparing computed transforms
  // instead would pass on float noise alone and certify a non-fix.
  key('ArrowRight');
  await wait(0);
  const anims=face('right').getAnimations();
  ok(anims.length===1,`arriving face has exactly one running transition (got ${anims.length})`);
  const kf=anims.length?anims[0].effect.getKeyframes():[];
  const twOf=(s)=>{const m=String(s).match(/rotate\((-?[\d.]+)deg\)\s*$/);return m?m[1]:'?';};
  const fromTw=twOf(kf[0]&&kf[0].transform), toTw=twOf(kf[kf.length-1]&&kf[kf.length-1].transform);
  ok(fromTw!=='?'&&fromTw===toTw,
     `twist is settled before the turn starts, so it never rides the curve (from ${fromTw}° → to ${toTw}°)`);
  await wait(1400);
  ok(hud()==='portfolio','…and the turn still lands on portfolio');
  ok(/rotate\((?!0deg)-?\d+deg\)/.test(face('right').style.transform),'that arrival carries a twist');

  log('\n— hit testing through the 3D transform —');
  let h=tileHit();
  ok(h.hit===h.t,`tile hit-testable on a twisted face (got ${desc(h.hit)})`);
  await clickAt(h.hit||h.t,h.x,h.y);
  ok(d.getElementById('projectOverlay').classList.contains('open'),'tile click opens the project card');
  log('     card title: "'+d.getElementById('projectTitle').textContent+'"');
  d.getElementById('projectClose').click(); await wait(300);

  // keyboard path: a real click focuses the tile, so model that explicitly —
  // synthetic pointer events do not move focus
  h.t.focus();
  ok(d.activeElement===h.t,'tile takes focus');
  h.t.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
  await wait(350);
  ok(d.getElementById('projectOverlay').classList.contains('open'),'Enter on a focused tile opens the card');

  log('\n— long card scrolls, close stays reachable —');
  const sc=d.getElementById('projectScroll');
  const meta=d.getElementById('projectMeta'), stack=d.getElementById('projectStack');
  ok(meta.querySelectorAll('dt').length>0,`meta block rendered (${meta.querySelectorAll('dt').length} rows)`);
  ok(stack.querySelectorAll('.chip-row').length>0||stack.querySelectorAll('span').length>0,
     `tech stack rendered (${stack.querySelectorAll('.chip-row').length} groups / ${stack.querySelectorAll('span').length} chips)`);
  // the card is already open from the click above; force it past one screen
  d.getElementById('projectSections').innerHTML +=
    Array.from({length:8},(_,i)=>`<h3>성과 ${i}</h3><p>${'검증용 본문 '.repeat(40)}</p>`).join('');
  await wait(200);
  ok(sc.scrollHeight>sc.clientHeight+50,`content overflows and the wrapper scrolls (${sc.scrollHeight} > ${sc.clientHeight})`);
  const btn=d.getElementById('projectClose'), cardR=d.querySelector('.project-card').getBoundingClientRect();
  sc.scrollTop=sc.scrollHeight;
  await wait(120);
  const b=btn.getBoundingClientRect();
  ok(b.top>=cardR.top-1&&b.bottom<=cardR.bottom+1,'close button stays pinned after scrolling to the bottom');
  ok(sc.scrollTop>0,'…and the wrapper actually scrolled');

  log('\n— focus containment —');
  ok(d.querySelector('.glass-nav').hasAttribute('inert'),'open card inerts the nav (not just the cube)');
  ok(d.querySelector('.chat-dock').hasAttribute('inert'),'…and the chat dock');
  ok(d.activeElement===d.querySelector('.project-card'),`focus moved into the card (is ${desc(d.activeElement)})`);
  d.getElementById('projectClose').click(); await wait(300);
  ok(!d.querySelector('.glass-nav').hasAttribute('inert'),'closing releases the nav');
  ok(d.activeElement===h.t,`focus restored to the tile (is ${desc(d.activeElement)})`);

  d.getElementById('homeBtn').click(); await wait(1400);
  d.getElementById('contactBtn').click(); await wait(300);
  ok(d.activeElement===d.querySelector('.contact-card'),'contact card takes focus');
  w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true})); await wait(300);
  ok(!d.querySelector('.glass-nav').hasAttribute('inert'),'Esc releases the nav too');

  log('\n— links and zoom on the other faces —');
  key('ArrowLeft'); await wait(1400);
  const p=d.querySelector('.planet'), pr=p.getBoundingClientRect();
  const px=Math.round(pr.left+pr.width/2), py=Math.round(pr.top+pr.height/2);
  const ph=d.elementFromPoint(px,py);
  ok(!!(ph&&ph.closest('.planet')),`planet hit-testable (got ${desc(ph)})`);
  const z0=scale();
  const ev=new w.WheelEvent('wheel',{deltaY:600,clientX:px,clientY:py,bubbles:true,cancelable:true});
  ph.dispatchEvent(ev);
  ok(ev.defaultPrevented,'the wheel over a planet reaches the zoom handler (no dead zone)');
  await wait(500);
  // informational only: the zoom spring runs on rAF, which headless virtual
  // time does not reliably advance
  log(`     (zoom scale ${z0.toFixed(3)} → ${scale().toFixed(3)})`);

  d.getElementById('homeBtn').click(); await wait(1400);
  key('ArrowDown'); await wait(1400);
  const lk=d.querySelector('.void-link'), lr=lk.getBoundingClientRect();
  const lh=d.elementFromPoint(Math.round(lr.left+lr.width/2),Math.round(lr.top+lr.height/2));
  ok(!!(lh&&lh.closest('.void-link')),`archive link hit-testable (got ${desc(lh)})`);
  ok(d.body.classList.contains('on-dark'),'dark face inverts the chrome');
  ok(w.getComputedStyle(face('bottom')).userSelect==='none','faces are not text-selectable (drag surface)');

  log('\n— tumble —');
  const st=d.getElementById('stage');
  st.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:12,clientX:640,clientY:400,bubbles:true}));
  for(let i=1;i<=6;i++){w.dispatchEvent(new w.PointerEvent('pointermove',{pointerId:12,clientX:640-i*40,clientY:400-i*12,bubbles:true}));await wait(16);}
  w.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:12,clientX:400,clientY:328,bubbles:true}));
  await wait(120);
  st.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:13,clientX:640,clientY:400,bubbles:true}));
  w.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:13,clientX:640,clientY:400,bubbles:true}));
  await wait(1600);
  check('after flick + catch-tap');
  ok(!face(frontOf(mat())).hasAttribute('inert'),'inert follows the landing');

  d.getElementById('homeBtn').click(); await wait(1400);
  ok(hud()==='cogspect','home returns to cogspect'); check('after home');
  ok(!d.body.classList.contains('on-dark'),'chrome un-inverts');

  // Chat: retrieval + auto-navigate + the pending indicator all run
  // synchronously, so this needs no model server. (A grouped `stack` object
  // once made retrieve() throw here, killing answers, navigation and marks.)
  log('\n— chat —');
  d.getElementById('homeBtn').click(); await wait(1400);
  const before=fails;
  const inp=d.getElementById('chatInput'), cf=d.getElementById('chatForm'), gm=d.getElementById('ghostMsg');
  inp.value='AI 관련된 프로젝트가 있어?';
  cf.dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
  ok(gm.classList.contains('pending'),'a question puts the answer bubble into its pending state');
  ok(cf.classList.contains('thinking'),'…and the chat bar shows the buffering sweep');
  ok(w.getComputedStyle(d.querySelector('.chat-bar'),'::after').animationName==='cgSweep','the sweep animation is live');
  await wait(1500);
  ok(hud()==='portfolio',`the answer turned the cube to the relevant face (${hud()})`);
  ok(d.querySelectorAll('.cell--proj.mark').length>0,
     `matched project tiles are highlighted (${d.querySelectorAll('.cell--proj.mark').length})`);
  if (fails===before) log('     (answers reach the model only when the local stack is up)');

  // Drag has two modes, picked by zoomTarget: zoomed in a gesture swipes
  // exactly one face; zoomed out it tumbles freely.
  log('\n— drag modes —');
  d.getElementById('homeBtn').click(); await wait(1400);
  // an earlier section zoomed out; swipe mode keys off zoomTarget, so put it back
  w.dispatchEvent(new w.WheelEvent('wheel',{deltaY:-900,clientX:640,clientY:400,bubbles:true,cancelable:true}));
  await wait(400);
  const stg=d.getElementById('stage');
  const gesture=async(dx,dy,id)=>{
    const x0=640,y0=400;
    stg.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:id,clientX:x0,clientY:y0,bubbles:true}));
    for(let i=1;i<=14;i++){
      w.dispatchEvent(new w.PointerEvent('pointermove',
        {pointerId:id,clientX:x0+dx*i/14,clientY:y0+dy*i/14,bubbles:true}));
      await wait(16);
    }
    w.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:id,clientX:x0+dx,clientY:y0+dy,bubbles:true}));
  };
  await gesture(-320,0,31); await wait(1500);
  ok(hud()==='portfolio',`zoomed in: one long drag turns exactly one face (${hud()})`);
  await gesture(0,-300,32); await wait(1500);
  ok(hud()==='minimalid',`…and a vertical drag turns one face too (${hud()})`);
  const held=hud();
  await gesture(-30,0,33); await wait(900);
  ok(hud()===held,'a drag under the threshold turns nothing');

  for(let i=0;i<6;i++){
    w.dispatchEvent(new w.WheelEvent('wheel',{deltaY:200,clientX:640,clientY:400,bubbles:true,cancelable:true}));
    await wait(100);
  }
  await wait(600);
  const m0=face('front').style.transform;
  stg.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:34,clientX:640,clientY:400,bubbles:true}));
  for(let i=1;i<=10;i++){
    w.dispatchEvent(new w.PointerEvent('pointermove',{pointerId:34,clientX:640-i*12,clientY:400-i*5,bubbles:true}));
    await wait(16);
  }
  ok(face('front').style.transform!==m0,'zoomed out: the cube tumbles continuously under the pointer');
  w.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:34,clientX:520,clientY:350,bubbles:true}));
  await wait(3200);
  // exactness after a tumble is covered by the catch-tap case above; headless
  // starves rAF, so the momentum roll may still be running here
  ok(hud()===LABELS[frontOf(mat())],`after a free tumble: HUD matches geometry (${hud()})`);

  /* ---------- cpt: the greeting, the voice, the wave -------------------- */

  log('\n— cpt —');
  // the harness has already been driving the page for a while, so the
  // greeting has long since come and gone; re-check the wiring instead of
  // the timing, which _rig.html covers with a shimmed rAF
  ok(typeof w.speechSynthesis !== 'undefined', 'the browser exposes a speech engine');
  for (const sel of ['.chat-bar', '.ghost-msg']) {
    ok(/blur\(|url\(/.test(w.getComputedStyle(d.querySelector(sel)).backdropFilter || ''),
       `${sel} is made of glass`);
  }
  /* The two cpt surfaces end differently, on purpose. The bubble is cpt
     speaking, so its boundary dissolves into a blurred halo; the bar is a
     thing you operate, so it wears the same drawn outline home/contact does.
     Both at once would be fog around a line. */
  const edgeOf = (sel) => parseFloat(w.getComputedStyle(d.querySelector(sel)).borderTopWidth);
  const haloOf = (sel) =>
    w.getComputedStyle(d.querySelector(sel), '::before').getPropertyValue('--halo').trim();
  ok(edgeOf('.chat-bar') > 0 && edgeOf('.chat-bar') === edgeOf('.glass-nav'),
     `the bar wears home/contact's outline (${edgeOf('.chat-bar')} vs ${edgeOf('.glass-nav')})`);
  /* Level --near on both before comparing. The edge firms up as the pointer
     approaches, so two surfaces at different distances have different border
     colours by design — comparing them as they stand tests where the pointer
     happens to be, not whether they wear the same edge. */
  const edgeStill = d.createElement('style');
  // ...and kill the transition, or the computed colour is wherever each one
  // was frozen on its way to the new value rather than the value itself
  edgeStill.textContent = '.chat-bar, .glass-nav { transition: none !important; }';
  d.head.appendChild(edgeStill);
  for (const sel of ['.chat-bar', '.glass-nav']) d.querySelector(sel).style.setProperty('--near', '0.5');
  await wait(40);
  const barEdge = w.getComputedStyle(d.querySelector('.chat-bar')).borderTopColor;
  const navEdge = w.getComputedStyle(d.querySelector('.glass-nav')).borderTopColor;
  ok(barEdge === navEdge, `the same one, not a lookalike (${barEdge})`);
  for (const sel of ['.chat-bar', '.glass-nav']) d.querySelector(sel).style.removeProperty('--near');
  edgeStill.remove();
  ok(!haloOf('.chat-bar'), 'and it dropped the halo it wore instead of an edge');
  ok(edgeOf('.ghost-msg') === 0 && !!haloOf('.ghost-msg'),
     'while the bubble keeps the halo and no edge');
  const vb = d.getElementById('voiceToggle');
  ok(!!vb, 'the voice can be turned off');
  ok(vb.getAttribute('aria-pressed') === 'true', 'and it starts on');
  /* It used to live in .hud, which is pointer-events:none, and needed an
     override to stay clickable. It is beside the chat bar now — the override
     is harmless there, but what actually has to hold is that a click lands. */
  ok(w.getComputedStyle(vb).pointerEvents === 'auto', 'the toggle takes a click');
  const vbBox = vb.getBoundingClientRect();
  const onTop = d.elementFromPoint(vbBox.left + vbBox.width / 2, vbBox.top + vbBox.height / 2);
  ok(vb.contains(onTop), `and nothing covers it (${onTop && onTop.tagName})`);
  vb.click();
  await wait(60);
  ok(vb.getAttribute('aria-pressed') === 'false' && vb.classList.contains('off'),
     'clicking it mutes cpt');
  ok(w.localStorage.getItem('cogspect.voice') === 'off', 'and the choice is remembered');
  vb.click();
  await wait(60);
  ok(vb.getAttribute('aria-pressed') === 'true', 'and it turns back on');
  ok(!!vb.querySelector('svg') && vb.textContent.trim() === '',
     'the control is an icon, not the word "voice"');
  ok(!!vb.querySelector('.vt-slash') && vb.querySelectorAll('.vt-wave').length === 2,
     'and it carries both states — waves on, slash off');

  /* ---- the microphone ---------------------------------------------------

     Sound in and sound out are one pair of controls, so they live together,
     beside the thing they act on rather than in a corner of the page. */
  const mb = d.getElementById('micToggle');
  const bar = d.getElementById('chatForm');
  ok(!!mb, 'there is a microphone to talk into');
  const near = (el) => el.getBoundingClientRect();
  /* They are folded into one round button now and rise out of it vertically,
     so the pair reads top-to-bottom rather than left-to-right — same order. */
  const ct = d.getElementById('controlToggle');
  ok(!!ct, 'the two switches live in one round control');
  /* The stack rises on a transform, and virtual time does not advance
     transitions — so the rect measured after adding .open is still the SHUT
     one, eight pixels low and at nine tenths scale. Kill the transition and
     measure where it actually goes. */
  const stackStill = d.createElement('style');
  stackStill.textContent =
    '.control-stack, .control-stack .voice-toggle { transition: none !important; }';
  d.head.appendChild(stackStill);
  d.getElementById('controlStack').classList.add('open');
  await wait(60);
  ok(near(mb).bottom <= near(vb).top + 1, 'the mic comes first, then the speaker');
  ok(near(vb).bottom <= near(ct).top + 1, 'and both rise above the button that holds them');
  ok(near(ct).right <= near(bar).left + 1, 'which sits to the left of the conversation bar');
  /* And the bar is on the middle of the SCREEN. It used to be pushed right by
     the width of the two switches sitting beside it, which is the whole reason
     they were folded into one button with an empty column opposite. */
  const barMid = (near(bar).left + near(bar).right) / 2;
  ok(Math.abs(barMid - w.innerWidth / 2) < 1.5,
     `and the bar is centred on the screen (${Math.round(barMid)} of ${w.innerWidth})`);
  d.getElementById('controlStack').classList.remove('open');
  stackStill.remove();

  /* It is a toggle, not a menu that only opens. */
  const soundStack = d.getElementById('controlStack');
  ok(!soundStack.classList.contains('open') && ct.getAttribute('aria-expanded') === 'false',
     'the switches start folded away');
  ct.click();
  await wait(80);
  ok(soundStack.classList.contains('open') && ct.getAttribute('aria-expanded') === 'true',
     'one press brings them out');
  ct.click();
  await wait(80);
  ok(!soundStack.classList.contains('open') && ct.getAttribute('aria-expanded') === 'false',
     'and another puts them back');
  /* ...and clicking away closes it too. A panel that can only be dismissed by
     the control that opened it is a panel you have to remember how to shut. */
  ct.click();
  await wait(80);
  d.getElementById('stage').dispatchEvent(new w.PointerEvent('pointerdown',
    {clientX: 300, clientY: 300, bubbles: true}));
  await wait(80);
  ok(!soundStack.classList.contains('open'), 'and so does a press anywhere else');

  /* Shut, the round button still has to say the microphone is open: that is
     the one state a visitor must never be wrong about, and a chevron is not
     allowed to hide it. */
  ok(!ct.classList.contains('hot'), 'closed and quiet, the button is unmarked');
  const realSR = w.SpeechRecognition;
  w.SpeechRecognition = function () { this.start = () => {}; this.stop = () => {}; };
  w.webkitSpeechRecognition = w.SpeechRecognition;
  mb.click();
  await wait(120);
  ok(ct.classList.contains('hot'), 'and marked while the microphone is live, folded or not');
  mb.click();
  await wait(120);
  w.SpeechRecognition = realSR;
  ok(!ct.classList.contains('hot'), 'and unmarked again when it closes');
  ok(Math.abs(near(mb).width - near(vb).width) < 1 &&
     Math.abs(near(mb).height - near(vb).height) < 1,
     `the two are the same size (${Math.round(near(mb).width)}px)`);
  /* Moving them next to the bar must not have come out of the bar. */
  ok(near(bar).width >= 439, `and the bar kept its own width (${Math.round(near(bar).width)}px)`);

  /* The mic is OFF, and unlike the speaker it does not remember being on.
     Leaving the speaker on costs a visitor nothing; a microphone that opens
     because it was open last time is one opened without being asked. */
  ok(mb.getAttribute('aria-pressed') === 'false' && mb.classList.contains('off'),
     'the mic starts off');
  ok(!Object.keys(localStorage).concat(Object.keys(w.localStorage))
      .some((k) => /mic|hear|listen/i.test(k)),
     'and nothing on this browser remembers it being on');

  /* Driving it. The constructor is looked up per attempt rather than captured
     at boot, so a stand-in can be installed here — which is the only way to
     test any of this without a microphone and a person to talk into it. */
  const spoken = [];
  let rec = null;
  w.SpeechRecognition = function () {
    rec = this;
    this.start = () => { this.running = true; };
    this.stop = () => { this.running = false; if (this.onend) this.onend(); };
    this.abort = this.stop;
  };
  w.webkitSpeechRecognition = w.SpeechRecognition;
  const realSubmit = d.getElementById('chatInput');
  /* On WINDOW, capture phase. A capture listener on the form itself would not
     help: at the target, listeners run in the order they were added whatever
     their phase, and the app's handler — which clears the field — was added
     first. Capturing on the way down is what gets there before it. */
  const onSubmit = () => { spoken.push(realSubmit.value); };
  w.addEventListener('submit', onSubmit, true);

  mb.click();
  /* Long enough to clear SELF_HEAR_GUARD. Opening the mic deafens it briefly
     on purpose — cpt may have been speaking a moment ago — so a test that
     talks immediately is talking into the guard. */
  await wait(900);
  ok(mb.getAttribute('aria-pressed') === 'true' && !mb.classList.contains('off'),
     'clicking it turns listening on');
  ok(rec && rec.running && rec.lang === 'ko-KR' && rec.continuous === true,
     'and it opens a Korean recognizer that keeps listening');

  /* A heard sentence goes down the same path a typed one does — into the
     field, then submit — so spoken commands route exactly like typed ones and
     there is one router rather than two. */
  const result = (text, isFinal) => rec.onresult({
    resultIndex: 0,
    results: Object.assign([[{transcript: text}]], {0: Object.assign([{transcript: text}], {isFinal})})
  });
  result('포트폴리오', false);
  await wait(40);
  ok(realSubmit.value === '포트폴리오' && spoken.length === 0,
     'a half-finished phrase is shown but never sent');
  result('음소거해줘', true);
  await wait(120);
  ok(spoken.includes('음소거해줘'),
     `a finished one goes through the chat, not around it (${JSON.stringify(spoken)})`);
  ok(vb.getAttribute('aria-pressed') === 'false',
     'so a spoken command works exactly as the typed one does');

  /* The failure mode of voice input: an open mic beside a speaking page
     transcribes the page, answers itself, and speaks again. */
  vb.click();                                  // voice back on
  await wait(60);
  spoken.length = 0;
  const wasSpeaking = Object.getOwnPropertyDescriptor(w.speechSynthesis, 'speaking');
  Object.defineProperty(w.speechSynthesis, 'speaking', {configurable: true, get: () => true});
  result('cogspect가 지향하는 디자인 공간입니다', true);
  await wait(120);
  ok(spoken.length === 0, `it does not hear cpt talking (${JSON.stringify(spoken)})`);
  if (wasSpeaking) Object.defineProperty(w.speechSynthesis, 'speaking', wasSpeaking);
  else delete w.speechSynthesis.speaking;

  mb.click();
  await wait(80);
  ok(mb.getAttribute('aria-pressed') === 'false' && !rec.running,
     'and clicking again closes the microphone');
  w.removeEventListener('submit', onSubmit, true);

  /* A site you operate by talking to it has to answer to the chat where it
     answers to the mouse, or the conversation is a search box in an agent's
     clothes. The switch and the sentence go through one setter, so they
     cannot end up disagreeing about what is on. */
  const ask = (t) => {
    d.getElementById('chatInput').value = t;
    d.getElementById('chatForm').dispatchEvent(new w.Event('submit', {bubbles: true, cancelable: true}));
  };
  ask('음소거해줘');
  await wait(400);
  ok(vb.getAttribute('aria-pressed') === 'false' && w.localStorage.getItem('cogspect.voice') === 'off',
     'asking cpt to mute works the same switch the button does');
  ok(/껐/.test(d.getElementById('ghostMsg').textContent), 'and it says so');
  ask('소리 켜줘');
  await wait(400);
  ok(vb.getAttribute('aria-pressed') === 'true' && w.localStorage.getItem('cogspect.voice') === 'on',
     'and asking for it back turns it on again');
  // "음소거 해제" contains "음소거"; if the lists were tested the other way round
  // this would silence the site instead of unmuting it
  ask('음소거 해제');
  await wait(400);
  ok(vb.getAttribute('aria-pressed') === 'true',
     'a request to UNDO the mute is not read as a request to mute');

  // speaking must never be the only channel: the bubble carries the text
  // whether or not any audio was allowed to play
  let said = null, saidAs = null;
  const realSpeak = w.speechSynthesis.speak.bind(w.speechSynthesis);
  w.speechSynthesis.speak = (u) => { if (u.volume === 0) return; said = u.text; saidAs = u; };
  const g = d.getElementById('ghostMsg');
  g.click();                                   // clear anything showing
  await wait(600);
  // force the offline path: the deployed site always answers from retrieval,
  // and it keeps this check off the local model server and its latency
  const realFetch = w.fetch;
  w.fetch = (u, o) => (String(u).includes('/chat/') ? Promise.reject(new Error('offline'))
                                                   : realFetch.call(w, u, o));
  d.getElementById('chatInput').value = 'cogspect가 뭐야?';
  d.getElementById('chatForm').dispatchEvent(new w.Event('submit', {bubbles: true, cancelable: true}));
  /* Text and voice arrive together. The bubble holds until the utterance
     actually starts — engine start latency is real and variable, so a bubble
     that appears the instant the message is queued is reliably ahead of the
     audio. Here there is no audio at all, so what is being checked is the
     other half: that a silent engine costs the text only the cap, never the
     whole message. */
  await wait(220);
  const early = [...d.querySelectorAll('#ghostMsg .ghost-line')].length;
  ok(early === 0, `nothing is typed before the voice starts (${early} lines)`);
  await wait(1400);
  ok([...d.querySelectorAll('#ghostMsg .ghost-line')].length > 0,
     'and a silent engine still releases it, well inside a second');
  w.fetch = realFetch;
  ok(g.classList.contains('show') && g.textContent.trim().length > 0,
     'an answer always reaches the bubble');
  /* The bubble holds the answer as separate lines now, so its textContent is
     the copy with the break points' whitespace removed — compare what SURVIVES
     the split, not the characters. The point of the assertion is unchanged:
     the voice must be reading the same answer the reader is looking at. */
  const strip = (t) => String(t).replace(/\s+/g, '');
  for (let i = 0; i < 60 && g.classList.contains('typing'); i++) await wait(100);
  const onScreen = [...g.querySelectorAll('.ghost-line')].map((n) => n.textContent).join('');
  /* Not equality: the bubble holds three lines, so a long answer has already
     retired its opening by the time it finishes typing. What must hold is
     that everything on screen came out of the answer the voice was given. */
  ok(said && onScreen.length > 0 && strip(said).indexOf(strip(onScreen)) >= 0,
     'and what is on screen came from the answer handed to the voice');
  /* The register. Which voice is installed is the platform's business; what
     is ours is to leave its pitch alone. These engines resample rather than
     resynthesise, so every attempt to move it — down for gravity, up for
     youth — was audible as processing and none of them sounded better. This
     bound exists to catch the next such attempt. */
  ok(saidAs && saidAs.pitch === 1, `cpt speaks at the voice's own pitch (${saidAs && saidAs.pitch})`);
  ok(saidAs && saidAs.rate > 1.2, `and briskly (rate ${saidAs && saidAs.rate})`);

  /* Which voice gets picked. The list a browser offers is a platform detail
     and this one offers none at all, so the ranking can only be tested
     against a stand-in — and `lang` is what carries the answer back, since
     speak() copies it from whichever voice it settled on.

     The names here are the LOCALISED ones, deliberately. `say` calls this
     voice "Minsu (Enhanced)" and Chrome in Korean calls the very same voice
     "민수(고품질)", and matching English substrings against a Korean list
     found nothing at all — a correctly ranked list that still produced the
     wrong voice, which is the bug this stand-in exists to keep out. */
  const realVoices = w.speechSynthesis.getVoices.bind(w.speechSynthesis);
  const stand = (name, lang) => ({name, lang, localService: true, default: false});
  w.speechSynthesis.getVoices = () => [
    stand('유나', 'ko-KR-yuna'),
    stand('에디(한국어(한국))', 'ko-KR-eddy'),
    stand('민수', 'ko-KR-minsu'),
    stand('민수(고품질)', 'ko-KR-minsu-enhanced'),
    stand('Samantha', 'en-US')
  ];
  saidAs = null;
  ask('모델 상태');
  for (let i = 0; i < 40 && !saidAs; i++) await wait(100);
  ok(saidAs && /minsu/.test(saidAs.lang),
     `it picks the Korean male voice over the character ones, by its Korean name (${saidAs && saidAs.lang})`);
  ok(saidAs && /enhanced/.test(saidAs.lang),
     `and 고품질 over the plain cut of the same voice (${saidAs && saidAs.lang})`);

  /* What most visitors get. Minsu is an optional download, so the common case
     is a machine without it — and there the choice is between the platform's
     own Korean voice and Apple's character set, which reads Korean as if
     sounding out a foreign language. The natural one wins even though it is
     female: no platform ships a natural Korean male voice by default, and
     recorded-for-Korean is the property that matters. */
  const pickWith = async (voices) => {
    w.speechSynthesis.getVoices = () => voices;
    saidAs = null;
    ask('모델 상태');
    for (let i = 0; i < 40 && !saidAs; i++) await wait(100);
    return saidAs && saidAs.lang;
  };
  const noMinsu = [
    stand('에디(한국어(한국))', 'ko-KR-eddy'),
    stand('로코(한국어(한국))', 'ko-KR-rocko'),
    stand('유나', 'ko-KR-yuna'),
    stand('Samantha', 'en-US')
  ];
  ok(await pickWith(noMinsu) === 'ko-KR-yuna',
     'without Minsu it takes the platform’s own Korean voice, not a character one');
  /* And when the character voices are all there is, one of them is still the
     answer: an English voice pronouncing Korean is the worse failure, and the
     one visitors described as a foreigner reading off a card. */
  const onlyCharacters = [
    stand('에디(한국어(한국))', 'ko-KR-eddy'),
    stand('할아버지(한국어(한국))', 'ko-KR-grandpa'),
    stand('Samantha', 'en-US')
  ];
  ok(/^ko-KR/.test(await pickWith(onlyCharacters) || ''),
     'and if they are all there is, it still speaks Korean rather than falling back to English');
  w.speechSynthesis.getVoices = realVoices;
  ok([...g.querySelectorAll('.ghost-line')].length > 0,
     'every cpt answer arrives as typed lines, not only the greeting');

  /* Whether there is a model to talk to is discovered, not assumed. The
     request above was rejected, which is what a model server going away
     looks like from here — the site has to notice and say so rather than
     keep claiming a capability it no longer has. */
  g.click();
  await wait(600);
  ask('모델 상태');
  await wait(1200);   // +550: the bubble now waits for the voice to start
  ok(/검색 기반/.test(g.textContent),
     `after a failed request it reports the mode it is actually in (${g.textContent.slice(0, 40)})`);
  w.speechSynthesis.speak = realSpeak;

  /* ---------- set pieces ---------------------------------------------- */

  log('\n— the way in —');

  /* On a page of its own. The chips retire the moment the visitor types, and
     by this point in the suite we have typed a dozen times — testing them on
     the main page would be testing a visitor who is no longer new. */
  const f4 = document.createElement('iframe');
  f4.style.cssText = 'width:1280px;height:800px;border:1px solid #ddd';
  document.body.appendChild(f4);
  await new Promise((r) => { f4.addEventListener('load', r, {once: true}); f4.src = '../index.html'; });
  const w4 = f4.contentWindow, d4 = f4.contentDocument;
  if (w4.speechSynthesis) { w4.speechSynthesis.speak = () => {}; w4.speechSynthesis.cancel = () => {}; }
  const hud4 = () => d4.getElementById('faceIndicator').textContent;
  /* The chips are the SECOND thing a visitor is offered, not the first. Three
     buttons appearing beside a greeting still being typed is an interface
     competing with itself. */
  await wait(3600);                              // intro done, greeting running
  ok(d4.getElementById('ghostMsg').classList.contains('show'),
     'cpt is still introducing the place');
  ok(!d4.getElementById('chatChips').classList.contains('show'),
     'and the questions wait rather than talking over it');
  d4.getElementById('ghostMsg').click();
  await wait(900);

  /* A cube tells you nothing about itself: no map, no sign that five other
     rooms exist, and a bar underneath that reads as a search field rather
     than as something that answers. These two are the whole of the fix. */
  const chips = [...d4.querySelectorAll('.chip')];
  ok(chips.length === 3, `three questions are offered (${chips.length})`);
  ok(d4.getElementById('chatChips').classList.contains('show'),
     'and they are showing once the stage is handed over');
  ok(chips.every((c) => c.classList.contains('liquid')),
     'they are made of the same glass as everything else');
  /* Thinner than the bars. These hover over whatever room you are in, and a
     plate over the content is the one thing they must not be. */
  const alphaOf = (c) => Number((/[/,]\s*([\d.]+)\s*\)\s*$/.exec(c) || [])[1] ?? 1);
  const chipA = alphaOf(w4.getComputedStyle(chips[0]).backgroundColor);
  const barA = alphaOf(w4.getComputedStyle(d4.querySelector('.chat-bar')).backgroundColor);
  ok(chipA < barA, `and thinner than the bar they sit over (${chipA} vs ${barA})`);
  /* Flush with the BAR, not with the dock. The dock is wider than the bar by
     the two controls hanging off its left, so a row centred on the dock sits
     visibly left of the thing it belongs to. */
  const rowBox = d4.getElementById('chatChips').getBoundingClientRect();
  const barSpan = d4.querySelector('.chat-bar').getBoundingClientRect();
  ok(Math.abs(rowBox.left - barSpan.left) < 1.5 && Math.abs(rowBox.right - barSpan.right) < 1.5,
     `the row is the bar's own width (${Math.round(rowBox.left)}–${Math.round(rowBox.right)}` +
     ` vs ${Math.round(barSpan.left)}–${Math.round(barSpan.right)})`);
  /* Gathered on the middle one, and centred on the BAR's centre rather than
     the dock's — the dock's is 34px to the left of it, which is the whole
     reason the row is given the bar's span rather than the dock's. */
  const ends = [chips[0].getBoundingClientRect(), chips[chips.length - 1].getBoundingClientRect()];
  const clusterMid = (ends[0].left + ends[1].right) / 2;
  ok(Math.abs(clusterMid - (barSpan.left + barSpan.right) / 2) < 2,
     `they gather on the bar's centre (${Math.round(clusterMid)} vs ${Math.round((barSpan.left + barSpan.right) / 2)})`);
  ok(ends[0].left > barSpan.left && ends[1].right < barSpan.right,
     'as a cluster, not stretched to the ends');
  /* They sit back. Three outlined pills at full strength under the
     conversation are the loudest thing on a page whose argument is quiet. */
  /* Virtual time does not advance transitions, so the computed opacity sits at
     its start value — 0 — and an unguarded version of this passes while the
     row is at full strength. Kill the transition and read the target. */
  const rowStill = d4.createElement('style');
  rowStill.textContent = '.chat-chips { transition: none !important; }';
  d4.head.appendChild(rowStill);
  const rowOp = Number(w4.getComputedStyle(d4.getElementById('chatChips')).opacity);
  ok(rowOp > 0.4 && rowOp < 0.85, `and the row does not shout (opacity ${rowOp})`);
  rowStill.remove();

  /* Answered from a table, not the model. The point is that it lands the
     instant you tap, so this must not wait on a network round trip — the
     fetch is left live on purpose: if a chip reached for it, this hangs. */
  const chipT0 = Date.now();
  chips[1].click();                              // 포트폴리오 소개해
  // when the first character lands, not when the sentence finishes typing —
  // the claim is that nothing was waited on, and cpt types at its own pace
  for (let i = 0; i < 40; i++) {
    if ([...d4.querySelectorAll('.ghost-line')].some((n) => n.textContent)) break;
    await wait(50);
  }
  ok(Date.now() - chipT0 < 900, `it answers without a round trip (${Date.now() - chipT0}ms)`);
  for (let i = 0; i < 60 && d4.getElementById('ghostMsg').classList.contains('typing'); i++) {
    await wait(100);
  }
  const chipText = [...d4.querySelectorAll('.ghost-line')].map((n) => n.textContent).join(' ');
  ok(/잔디|픽셀/.test(chipText), `and it is the table's answer (${chipText.slice(0, 20)})`);
  ok(chips[1].classList.contains('spent'), 'the one you used steps out of the row');
  ok(!d4.getElementById('chatChips').classList.contains('show'),
     'and the row stands aside while cpt is answering');
  await wait(2800);
  ok(hud4() === LABELS.right, `it took the cube to the room it is about (${hud4()})`);
  ok(!/작업 기록입니다/.test([...d4.querySelectorAll('.ghost-line')].map((n) => n.textContent).join(' ')),
     'and that room does not introduce itself over the top of the answer');

  /* They belong to the front face. Everywhere else has its own island bar
     saying what it is, and a second explanation underneath it is noise. */
  d4.getElementById('ghostMsg').click();
  await wait(900);
  ok(!d4.getElementById('chatChips').classList.contains('show'),
     'and they do not follow you into the room they opened');
  d4.getElementById('homeBtn').click();
  await wait(1800);
  ok(d4.getElementById('chatChips').classList.contains('show'),
     'they are waiting again when you come back to the front');

  /* Typing retires them. They were an opening; once the visitor has spoken to
     the site they have learned what the chips existed to teach, and three
     standing buttons on a page this quiet are clutter. */
  d4.getElementById('chatInput').value = '음소거해줘';
  d4.getElementById('chatForm').dispatchEvent(new w4.Event('submit', {bubbles: true, cancelable: true}));
  await wait(1200);
  d4.getElementById('ghostMsg').click();
  await wait(900);
  ok(!d4.getElementById('chatChips').classList.contains('show'),
     'and once you have typed to it yourself, they retire');

  /* The hot corners. A scroll page is intuitive because you can SEE there is
     more below — the cut-off next section IS the affordance. A cube has none,
     so the object leans to show what is waiting there.

     Corners rather than edges: the edges are where the chrome lives, the nav
     at the top right and the chat dock along the bottom, and a corner is a
     more deliberate place to put a pointer than a whole edge — you do not
     arrive there on the way to something else. */
  d4.getElementById('homeBtn').click();
  await wait(1800);
  d4.getElementById('ghostMsg').click();
  await wait(700);
  const frontOf4 = d4.querySelector('[data-face="front"]');
  const square = frontOf4.style.transform;
  const glance = (x, y) => w4.dispatchEvent(new w4.PointerEvent('pointermove',
    {clientX: x, clientY: y, bubbles: true}));
  const CORNERS = [
    [40, 40, 'prospect', 'top-left'],
    [w4.innerWidth - 40, 40, 'portfolio', 'top-right'],
    [w4.innerWidth - 40, w4.innerHeight - 40, 'minimalid', 'bottom-right'],
    [40, w4.innerHeight - 40, 'Bifröst', 'bottom-left']
  ];
  const roomLine = () => [...d4.querySelectorAll('.ghost-line')].map((n) => n.textContent).join(' ');
  const seenLines = [];
  for (const [x, y, room, name] of CORNERS) {
    glance(w4.innerWidth / 2, w4.innerHeight / 2);
    await wait(220);
    glance(x, y);
    await wait(150);
    ok(frontOf4.style.transform !== square, `${name} leans the cube`);
    ok(d4.body.classList.contains('peeking'),
       `${name}: and the page knows it is leaning`);
    /* A lean is not a turn. The pose goes to paintFaces() directly and O is
       untouched, so an arrow key mid-peek still turns from a square pose —
       and the cube's own account of where it is never wavers. */
    ok(hud4() === LABELS.front, `${name}: and the cube still believes it is home`);
    /* Wait for the line to CHANGE, not merely to exist: the previous corner's
       line is still on screen, so polling for "non-empty" reads the last room
       every time and the test passes while nothing updates. */
    const was = roomLine();
    for (let i = 0; i < 40 && roomLine() === was; i++) await wait(100);
    for (let i = 0; i < 40 && d4.getElementById('ghostMsg').classList.contains('typing'); i++) {
      await wait(80);
    }
    seenLines.push(roomLine());
    ok(new RegExp(room === 'portfolio' ? '포트폴리오'
                : room === 'Bifröst' ? '다리'
                : room === 'prospect' ? 'prospect'
                : 'minimalid').test(roomLine()),
       `${name} names ${room} (${roomLine().slice(0, 16)})`);
  }
  /* Each corner names a different room, every time — not once per visit, and
     not four lines stacked up. The newest REPLACES the last, because moving
     from corner to corner is one person looking around, not four questions. */
  ok(new Set(seenLines).size === 4,
     `each corner names its own room (${seenLines.length} lines, ${new Set(seenLines).size} distinct)`);
  ok(/포트폴리오/.test(seenLines[1]), `the top-right corner is the portfolio (${seenLines[1].slice(0, 18)})`);
  ok(seenLines.every((l) => l.split('.').filter(Boolean).length <= 3),
     'and each is one line, not a queue of everything you passed');

  /* The lean has to REVEAL something. At fifteen degrees the arriving face
     projected as a sixteen-pixel sliver tucked inside the front face's own
     silhouette — so the peek was a tilt with nothing behind it, and no amount
     of shading could have fixed that. It has to clear the silhouette, which
     it does from about twenty-six degrees. */
  const shadeStill = d4.createElement('style');
  // the canvas's fade is a transition too, and virtual time freezes it at 1
  // .stage::after fades in on a transition too, and virtual time leaves every
  // one of these at its start value
  shadeStill.textContent =
    '.face, .face::after, .grid-canvas, .stage::after { transition: none !important; }';
  d4.head.appendChild(shadeStill);
  glance(w4.innerWidth / 2, w4.innerHeight / 2);
  await wait(200);
  glance(w4.innerWidth - 40, 40);
  await wait(320);
  const frontBox = frontOf4.getBoundingClientRect();
  const nextBox = d4.querySelector('[data-face="right"]').getBoundingClientRect();
  ok(nextBox.width > 50,
     `the room arriving is a plane, not a sliver (${Math.round(nextBox.width)}px)`);
  ok(nextBox.left >= frontBox.right - 2,
     'and it clears the face you are on rather than hiding inside it');
  /* Shading, which is the other half: a solid turning under a fixed light does
     not keep an even tone, so the face you are on darkens along the edge going
     back and the one arriving is darker throughout. */
  const shadeOf = (sel) => w4.getComputedStyle(d4.querySelector(sel), '::after');
  ok(Number(shadeOf('[data-face="front"]').opacity) === 1,
     'the shading is on while it leans');
  ok(/gradient/.test(shadeOf('[data-face="right"]').backgroundImage),
     'and the arriving face carries its own');
  ok(d4.getElementById('stage').style.getPropertyValue('--peek-ang') === '90',
     'aimed along the direction the lean runs');
  /* The lattice steps aside. It is a flat screen-space canvas painted OVER the
     cube, so it cannot turn with it — and a tilted plane under an untilted
     texture reads as two layers stacked rather than one solid seen from an
     angle, which is exactly what the side face looked like. */
  ok(Number(w4.getComputedStyle(d4.getElementById('grid')).opacity) === 0,
     'and the flat lattice is out of the way while the cube is turned');
  /* The far end of the side face dissolves rather than ending on a diagonal —
     a converging edge is what says "small box" instead of "room you are about
     to enter", and it cannot be pushed off the frame: the cube is zoomed to
     sit INSIDE the frame, so its whole silhouette stays there however far it
     turns. Measured across tilts to 40° and lean-ins to 1.7x. */
  const wash = w4.getComputedStyle(d4.querySelector('.stage'), '::after');
  ok(Number(wash.opacity) === 1 && /gradient/.test(wash.backgroundImage),
     'the far end is washed into the page rather than ending on a diagonal');
  ok(d4.getElementById('stage').style.getPropertyValue('--peek-back') === '1',
     'and sideways the view does not need to stand back');
  /* And only the face you are STANDING ON gets the bright rim. Brightening
     every face drew a 1px white line along that converging far edge, which
     is the outline the wash was fighting. */
  const rimOf = (sel) => w4.getComputedStyle(d4.querySelector(sel)).borderTopColor;
  ok(rimOf('[data-face="front"]') !== rimOf('[data-face="right"]'),
     'and the arriving face is not outlined, only the fold is');
  shadeStill.remove();

  /* Up and down are the other way round on both counts.

     At 100% the cube's face is as wide as the screen and TALLER than it, so
     the top face is bigger than the viewport and its far edge sits above the
     top of it at every tilt from 30° to 54° — measured. The convergence that
     makes it read as the top of a solid happens off-screen entirely. You
     cannot see the top of a box with your nose against its front, so the view
     stands back far enough to catch it.

     And having gone to that trouble, the wash must not then erase it: the
     converging far edge is the whole point here, where sideways it was the
     thing to hide. */
  glance(w4.innerWidth / 2, w4.innerHeight / 2);
  await wait(250);
  glance(40, 40);                                // top-left: the face above
  await wait(400);
  ok(Number(d4.getElementById('stage').style.getPropertyValue('--peek-back')) < 0.8,
     `looking up, the view stands back (${d4.getElementById('stage').style.getPropertyValue('--peek-back')})`);
  ok(d4.getElementById('stage').style.getPropertyValue('--peek-wash') === '0',
     'and nothing washes over the convergence it went back to see');
  const topBox = d4.querySelector('[data-face="top"]').getBoundingClientRect();
  ok(topBox.top > 0 && topBox.left > 0 && topBox.right < w4.innerWidth,
     `so the whole face is in frame, corners and all (${Math.round(topBox.left)},` +
     `${Math.round(topBox.top)}→${Math.round(topBox.right)})`);
  /* The shading aims AWAY, at the far edge. Up and down were inverted at
     first, which put the shadow on the fold — the one edge that must be
     lightest, since it is the nearest thing on screen. */
  ok(d4.getElementById('stage').style.getPropertyValue('--peek-ang') === '0',
     'and the shading runs toward the far edge, not the fold');

  glance(w4.innerWidth / 2, w4.innerHeight / 2);
  await wait(600);
  ok(frontOf4.style.transform === square, 'and it comes back when you leave');
  ok(!d4.body.classList.contains('peeking'), 'shading and all');

  /* Never mid-gesture. A peek is a hover affordance, and while a pointer is
     down the visitor is tumbling the cube or carrying the keen specimen —
     leaning it then reads as the drag having turned it. */
  w4.dispatchEvent(new w4.PointerEvent('pointerdown', {clientX: 500, clientY: 400, bubbles: true}));
  glance(w4.innerWidth - 40, 40);
  await wait(250);
  ok(frontOf4.style.transform === square, 'and never while something is being dragged');
  w4.dispatchEvent(new w4.PointerEvent('pointerup', {clientX: 500, clientY: 400, bubbles: true}));
  await wait(200);
  f4.remove();

  log('\n— set pieces —');
  d.getElementById('homeBtn').click();
  await wait(1400);

  // the intro must always hand the page back: a stuck 'intro' class leaves
  // the visitor with no nav, no chat and no wordmark, which is unrecoverable
  ok(!d.getElementById('stage').classList.contains('intro'), 'intro released the stage');
  for (const sel of ['.glass-nav', '.chat-dock', '.wordmark', '.hud']) {
    ok(w.getComputedStyle(d.querySelector(sel)).opacity === '1', `intro restored ${sel}`);
  }

  /* A face shows nothing until it has landed square. Turning the cube used to
     sweep every room past the camera edge-on — the portfolio grid, the bridge,
     the keen entry, all legible in passing — which spoils each face before you
     arrive at it and makes the motion read as six screens on a spinning frame
     rather than as one object.

     Virtual time does not advance transitions, so a computed opacity sits at
     its start value forever and EVERYTHING measures as hidden, pass or fail.
     Kill the transition and read the target each state resolves to. */
  const contentStill = d.createElement('style');
  contentStill.textContent = '.face > * { transition: none !important; }';
  d.head.appendChild(contentStill);
  const drawn = () => [...d.querySelectorAll('.face > *')]
    .filter((n) => Number(w.getComputedStyle(n).opacity) > 0.02);
  const bodyOf = (n) => [...n.parentElement.children].indexOf(n) >= 0 && n.parentElement.dataset.face;

  ok(drawn().length > 0, 'the face you are on shows its room');
  key('ArrowRight');
  await wait(120);                              // mid-turn, well before it settles
  ok(drawn().length === 0, `nothing is drawn while the cube turns (${drawn().length} showing)`);
  await wait(1500);
  const here = drawn();
  ok(here.length > 0 && here.every((n) => bodyOf(n) === 'right'),
     `and the room appears once it lands, only that room (${here.map(bodyOf).join(',')})`);
  key('ArrowLeft');
  await wait(1500);
  contentStill.remove();

  // The lattice belongs to the cursor. An earlier pass painted it
  // permanently and that is exactly what must not come back.
  const bgOf = (sel, pseudo) => w.getComputedStyle(d.querySelector(sel), pseudo).backgroundImage;
  ok(bgOf('.stage', '::before') === 'none', 'the stage paints no permanent lattice');
  ok(bgOf('.face--keen', '::before') === 'none', 'faces paint no permanent lattice');
  const veil = w.getComputedStyle(d.getElementById('grassVeil'));
  const veilMask = veil.maskImage || veil.webkitMaskImage || '';
  ok(/transparent|rgba\(0,\s*0,\s*0,\s*0\)/.test(veilMask),
     'the grass veil is still revealed by the cursor, not painted on');
  ok(!d.querySelector('.grass-legend'), 'no legend');

  // the ambient cloud exists but lives behind a blur
  ok(d.querySelectorAll('.cell--amb').length > 60, 'ambient activity cells were planted');
  const ambWrap = d.querySelector('.grass-amb');
  ok(!!ambWrap && /blur\(/.test(w.getComputedStyle(ambWrap).filter),
     'the ambient cloud is blurred rather than sharp');

  // the five-second introduction: lit on arrival, gone afterwards
  const labels = [...d.querySelectorAll('.cell-label')];
  ok(labels.length === d.querySelectorAll('.cell--proj').length,
     'every project pixel has a label to reveal');
  key('ArrowRight');
  await wait(1200);
  ok(hud() === LABELS.right, 'arrived at the portfolio');
  ok(face('right').classList.contains('reveal'), 'arrival lights the six projects');
  ok(w.getComputedStyle(labels[0]).opacity !== '0', 'labels are showing during the reveal');
  const off = labels.filter(l => { const r = l.getBoundingClientRect();
    return r.right < 2 || r.left > w.innerWidth - 2; });
  ok(off.length === 0, `every label lands inside the viewport (${off.length} off-screen)`);
  // the clock starts when the face LANDS (setFace runs on settle), not when
  // the key was pressed, so allow for the quarter turn before checking
  await wait(5400);
  ok(!face('right').classList.contains('reveal'), 'the reveal releases after five seconds');
  // the fade-out is a .9s transition and transitions do not advance under
  // virtual time, so read the resting value with the transition removed
  const noTr = d.createElement('style');
  noTr.textContent = '.cell-label{transition:none!important}';
  d.head.appendChild(noTr);
  void d.body.offsetHeight;
  ok(labels.every(l => w.getComputedStyle(l).opacity === '0'),
     'and the labels rest hidden again, leaving a clean field');
  noTr.remove();

  // the notification bars: one per face, parked at the top of the SCREEN
  d.getElementById('homeBtn').click();
  await wait(1200);
  ok(!face('front').querySelector('.face-banner'),
     'the cover face keeps its bare lede — no bar');
  /* The bar lives inside the cube, so its screen position is multiplied by
     the zoom. Under virtual time the rAF spring never reaches 1, so pin the
     wrap at production scale for the duration of this check — an inline
     write would be overwritten by the next tick(), a stylesheet !important
     cannot be. */
  const pin = d.createElement('style');
  // the bar's own arrival transition does not advance under virtual time
  // either, so read its resting landed pose rather than a frozen first frame
  pin.textContent = '#zoomWrap{transform:scale(1)!important;transition:none!important}'
    + '.face-banner{transition:none!important}';
  d.head.appendChild(pin);
  // every face is reached FROM the front face; the back one needs two turns
  const bars = [];
  for (const [name, ks] of [['right',['ArrowRight']], ['left',['ArrowLeft']],
                            ['top',['ArrowUp']], ['bottom',['ArrowDown']],
                            ['back',['ArrowRight','ArrowRight']]]) {
    d.getElementById('homeBtn').click();
    await wait(1100);
    for (const k of ks) { key(k); await wait(1000); }
    await wait(200);
    const bar = face(name).querySelector('.face-banner');
    if (!bar) { ok(false, `${name} has a bar`); continue; }
    ok(face(name).classList.contains('landed'),
       `${name}: the bar is only shown once the face has landed`);
    const r = bar.getBoundingClientRect();
    const clear = ['.glass-nav', '.chat-bar', '.wordmark'].every(sel => {
      const c = d.querySelector(sel).getBoundingClientRect();
      return r.right <= c.left || c.right <= r.left || r.bottom <= c.top || c.bottom <= r.top;
    });
    ok(r.top > 0 && r.top < 110 && r.left >= 0 && r.right <= w.innerWidth && clear,
       `${name}: bar at the top of the screen, clear of the chrome (top ${Math.round(r.top)})`);
    // one size for every face, and the copy sized to fit it rather than the
    // other way round — a wrapped title is what would break this
    const h2 = bar.querySelector('h2');
    ok(bar.scrollHeight <= bar.clientHeight + 1 && h2.scrollWidth <= h2.clientWidth + 1,
       `${name}: the copy fits the fixed box`);
    bars.push({ name, w: Math.round(r.width), h: Math.round(r.height), t: Math.round(r.top) });
  }
  for (const k of ['w', 'h', 't']) {
    const vals = new Set(bars.map((b) => b[k]));
    ok(vals.size === 1, `every bar shares the same ${k} (${[...vals].join(', ')})`);
  }

  // the keen face keeps its dictionary entry, and it must clear its bar
  const kb = face('back').querySelector('.face-banner').getBoundingClientRect();
  const ke = d.querySelector('.keen-grid').getBoundingClientRect();
  ok(ke.top >= kb.bottom,
     `the keen entry sits below its bar (bar ends ${Math.round(kb.bottom)}, entry starts ${Math.round(ke.top)})`);
  ok(d.querySelector('.keen-card--word .keen-title').textContent.includes('keen'),
     'and the dictionary entry still says what it said');
  /* ---- keen: the bar is the lens ----------------------------------------

     The entry for keen is out of focus and the bar above it brings it in.
     Press to read, press again to let it go. It used to steer a slab of glass
     you dragged across the face, which demonstrated the material well — but
     carrying a pane around to read a paragraph is work, and this room's whole
     argument is that the design gets out of your way. */
  const khl = d.getElementById('keenHandle');
  const kCopy = () => w.getComputedStyle(d.querySelector('.keen-card--word'));
  ok(khl.getAttribute('role') === 'button' && khl.hasAttribute('aria-pressed'),
     'the bar is a control, and says so');
  ok(khl.getAttribute('aria-controls') === 'keenEntry',
     'and names what it acts on');
  ok(Number(khl.tabIndex) >= 0, 'and can be reached from the keyboard');
  ok(!d.getElementById('keenSlab'), 'the slab you had to drag is gone');

  /* Blurred until asked. keen is a lens, so the entry for keen is the one
     thing on this site you can only read THROUGH one. */
  ok(/blur\(([\d.]+)px\)/.test(kCopy().filter) &&
     Number(/blur\(([\d.]+)px\)/.exec(kCopy().filter)[1]) > 1,
     `the explanation is out of focus (${kCopy().filter})`);
  ok(khl.getAttribute('aria-pressed') === 'false', 'and the bar is not pressed');
  /* The focus pull sweeps rather than switching: the headword lands before the
     definition. Read BEFORE the transitions are killed below, since killing
     them is what makes every delay read as zero. */
  /* One face is all the room there is, so the space is divided rather than
     scrolled: cards of different sizes, every one of them made of keen, which
     makes the grid itself the specimen and an empty card an exhibit. */
  const cards = [...d.querySelectorAll('.keen-card')];
  ok(cards.length >= 6, `the space is a grid of cards (${cards.length})`);
  ok(cards.every((c) => c.classList.contains('liquid')),
     'every one of them made of the same glass');
  const areas = new Set(cards.map((c) => {
    const r = c.getBoundingClientRect();
    return Math.round(r.width / 10) + 'x' + Math.round(r.height / 10);
  }));
  ok(areas.size >= 4, `and they are not all one size (${areas.size} distinct)`);
  ok(d.querySelector('.keen-card--word').getBoundingClientRect().width >
     cards[cards.length - 1].getBoundingClientRect().width,
     'the entry has the largest of them');
  /* The focus sweeps ACROSS the grid rather than switching it on — the entry
     first, the rest fanning out behind it. Read here, before the transitions
     are killed below: killing them is what makes every delay report zero. */
  d.getElementById('keenHandle').click();
  await wait(30);
  const sweep = cards.map((c) => w.getComputedStyle(c).transitionDelay);
  ok(new Set(sweep).size >= 4,
     `and they do not all arrive at once (${new Set(sweep).size} steps)`);
  d.getElementById('keenHandle').click();
  await wait(30);

  /* Virtual time does not advance transitions, so the computed filter sits at
     its start value forever and the blur never appears to lift, pass or fail. */
  const keenStill = d.createElement('style');
  keenStill.textContent =
    '.keen-card, .face-banner--handle { transition: none !important; }';
  d.head.appendChild(keenStill);

  /* The two swap places. At rest the bar is the clear thing on a blurred page;
     pressed, it hands that over — the room sharpens and the bar takes the blur
     on itself. The control says which state it is in by BEING the other one. */
  const blurOfBar = () => {
    const m = /blur\(([\d.]+)px\)/.exec(w.getComputedStyle(khl).backdropFilter || '');
    return m ? Number(m[1]) : null;
  };
  const restBlur = blurOfBar();

  khl.click();
  await wait(80);
  ok(khl.getAttribute('aria-pressed') === 'true', 'one press and it is reading');
  ok(blurOfBar() > restBlur + 4,
     `and the bar takes the blur the room gave up (${restBlur} → ${blurOfBar()})`);
  ok(face('back').classList.contains('reading'), 'the room knows it too');
  ok(/blur\(0px\)|none/.test(kCopy().filter) && Number(kCopy().opacity) > 0.95,
     `and the whole entry comes into focus, headword included (${kCopy().filter})`);
  /* And the focus pull sweeps rather than switching: out of focus is also
     slightly LARGER, which is what a lens does at the wrong focal plane, and
     the headword lands before the definition. */
  ok(/scale\(1\)|none|matrix\(1, 0, 0, 1/.test(kCopy().transform),
     `in focus, the cards settle into size (${kCopy().transform})`);

  khl.click();
  await wait(80);
  ok(khl.getAttribute('aria-pressed') === 'false' && /blur\([1-9]/.test(kCopy().filter),
     'and another press lets it go again');
  ok(blurOfBar() === restBlur, 'and the bar is clear glass again');
  ok(!/scale\(1\)|none/.test(kCopy().transform),
     `with the entry back at the wrong focal plane, slightly larger (${kCopy().transform})`);

  /* The keyboard has to work, since role=button carries no behaviour of its
     own — an element that says it is a button and cannot be pressed by one is
     worse than a div. */
  khl.dispatchEvent(new w.KeyboardEvent('keydown', {key: 'Enter', bubbles: true}));
  await wait(80);
  ok(khl.getAttribute('aria-pressed') === 'true', 'Enter presses it');
  khl.dispatchEvent(new w.KeyboardEvent('keydown', {key: ' ', bubbles: true}));
  await wait(80);
  ok(khl.getAttribute('aria-pressed') === 'false', 'and Space presses it again');

  keenStill.remove();

  /* Walking out puts it back out of focus, so the bar and the entry never
     disagree about which state the room is in. */
  khl.click();
  await wait(120);
  ok(khl.getAttribute('aria-pressed') === 'true', 'left reading');
  d.getElementById('homeBtn').click();
  await wait(1600);
  ok(khl.getAttribute('aria-pressed') === 'false' &&
     !face('back').classList.contains('reading'),
     'and leaving the room closes it again');

  /* Breathing, on a page that has not been pressed yet. Nothing about a title
     says "press me", and this bar is the only way into that room — but the
     hint stops for good once it has been followed, so by this point in the
     suite the main page has learned it and cannot be asked. */
  const f5 = document.createElement('iframe');
  f5.style.cssText = 'width:1280px;height:800px;border:1px solid #ddd';
  document.body.appendChild(f5);
  await new Promise((r) => { f5.addEventListener('load', r, {once: true}); f5.src = '../index.html'; });
  const w5 = f5.contentWindow, d5 = f5.contentDocument;
  if (w5.speechSynthesis) { w5.speechSynthesis.speak = () => {}; w5.speechSynthesis.cancel = () => {}; }
  await wait(4200);
  const key5 = (k) => w5.dispatchEvent(new w5.KeyboardEvent('keydown', {key: k, bubbles: true}));
  key5('ArrowRight'); await wait(1300);
  key5('ArrowRight'); await wait(1600);
  const fresh = d5.getElementById('keenHandle');
  const breathOf = (el) => [...el.getAnimations()].map((a) => a.animationName || '');
  ok(!fresh.classList.contains('learned'), 'arriving, the bar has not been pressed');
  ok(breathOf(fresh).some((n) => /keenBreathe/.test(n)),
     `so it breathes to say it can be (${breathOf(fresh).join(',') || 'nothing'})`);
  fresh.click();
  await wait(200);
  ok(fresh.classList.contains('learned') &&
     !breathOf(fresh).some((n) => /keenBreathe/.test(n)),
     'and stops the moment it has been, rather than nagging');
  f5.remove();

  // mid-turn: no face may claim the bar
  d.getElementById('homeBtn').click();
  await wait(1100);
  key('ArrowRight');
  await wait(220);                       // still turning — settle is ~880ms
  ok(![...d.querySelectorAll('.face')].some(f => f.classList.contains('landed')),
     'no bar is shown while the cube is turning');
  await wait(1200);
  ok(face('right').classList.contains('landed'), 'and it comes back on arrival');

  // Bifröst: reaching the gate strikes the beam, and the beam is STRAIGHT
  d.getElementById('homeBtn').click();
  await wait(1200);
  key('ArrowLeft');
  await wait(1200);
  ok(hud() === LABELS.left, 'arrived at the gate');
  ok(face('left').classList.contains('bridged'), 'the Bifröst beam was struck on arrival');
  const beam = d.querySelector('.bridge-band');
  ok(w.getComputedStyle(beam).stroke.includes('bfrostBand'), 'the beam resolves its gradient');
  // it has to be a SPECTRUM, and it has to run across the beam rather than
  // along it — a gradient parallel to the run is a two-tone line, not a prism
  const grad = d.getElementById('bfrostBand');
  const stops = [...grad.querySelectorAll('stop')].map((n) => n.getAttribute('stop-color'));
  /* The shaft carries NO hue. Every colour on this bridge comes from the rays
     travelling along it, so the span is white until something passes through
     it — the gradient is an alpha ramp, nothing else. This is the assertion
     that stops it drifting back into a painted rainbow. */
  /* Achromatic, not literally #ffffff. Pure white alone was invisible: on a
     near-white page the whole available contrast is about eleven levels, so
     the shaft is white through the middle and silver at its flanks. What
     must hold is that it carries no HUE — every colour on this bridge comes
     from the rain. */
  const chroma = (c) => {
    const m = String(c).match(/[\da-f]{2}/gi) || [];
    const v = m.map((h) => parseInt(h, 16));
    return v.length === 3 ? Math.max(...v) - Math.min(...v) : 99;
  };
  const hues = stops.map(chroma);
  ok(stops.length > 0 && Math.max(...hues) <= 16,
     `the shaft carries no colour, only white and silver (${[...new Set(stops)].join(', ')})`);
  const alphas = [...grad.querySelectorAll('stop')]
    .map((n) => parseFloat(n.getAttribute('stop-opacity') || '1'));
  ok(Math.min(...alphas) === 0 && Math.max(...alphas) === 1,
     'and it is shaped by alpha alone, feathering to nothing at its edges');
  const gx = +grad.getAttribute('x2') - +grad.getAttribute('x1');
  const gy = +grad.getAttribute('y2') - +grad.getAttribute('y1');
  const bx = 66 - 36, by = 60 - 40;                     // the beam's own run
  const dot = Math.abs(gx * bx + gy * by) / (Math.hypot(gx, gy) * Math.hypot(bx, by));
  ok(dot < 0.02, `the spectrum runs across the beam, not along it (cos ${dot.toFixed(3)})`);
  /* orbWake must not fill forwards. A finished animation that fills keeps
     applying its end transform, and animation origin outranks author rules,
     so the hover/focus scale on these orbs would silently stop working. */
  const orbFill = w.getComputedStyle(d.querySelector('.planet--b3ta .orb')).animationFillMode;
  ok(!/both|forwards/.test(orbFill), `the gate wake does not fill forwards (${orbFill})`);
  ok(w.getComputedStyle(d.querySelector('.planet--v0id')).animationDelay ===
     w.getComputedStyle(d.querySelector('.planet--b3ta')).animationDelay,
     'both gates float on the same phase, so the beam stays on its anchors');

  /* The rain. One element per streak, because a path carrying a repeating
     dash gives every streak on it the same colour AND the same speed — a
     handful of those read as combs moving in lockstep rather than weather.
     The assertions are about INDEPENDENCE: many streaks, mostly distinct
     speeds, several colours, and each one short enough to be a streak
     rather than a comet. */
  const rays = [...d.querySelectorAll('.bridge-rain path')];
  ok(rays.length >= 24, `the span carries a shower, not a few streaks (${rays.length})`);
  const cs = rays.map((r) => w.getComputedStyle(r));
  const durs = new Set(cs.map((c) => c.animationDuration));
  ok(durs.size >= rays.length * 0.6,
     `and they fall at their own speeds (${durs.size} distinct across ${rays.length})`);
  const cols = new Set(cs.map((c) => c.stroke));
  ok(cols.size >= 4, `carrying several colours between them (${cols.size} distinct)`);
  const lens = cs.map((c) => parseFloat(c.strokeDasharray));
  ok(Math.max(...lens) <= 8,
     `each one a streak rather than a comet (longest ${Math.max(...lens).toFixed(1)} of 100)`);
  const coloured = cs.filter((c) => {
    const m = c.stroke.match(/\d+/g);
    return m && Math.max(+m[0], +m[1], +m[2]) - Math.min(+m[0], +m[1], +m[2]) > 40;
  });
  ok(coloured.length >= 8,
     `and enough of them carry real colour, not just brightness (${coloured.length}/${rays.length})`);
  // one filter on the group, not forty: forty raster passes a frame is what
  // made the intro drop frames in the first place
  ok(cs.every((c) => c.filter === 'none'),
     'no per-streak filter — the softness is one pass on the group');
  /* Nothing falls until the span has finished striking out. The delays once
     ran negative, which starts an animation already in progress — the rain
     was falling before the bridge had connected and the connection itself
     never read. The beam lands at .62 + 1.15 = 1.77s. */
  const delays = cs.map((c) => parseFloat(c.animationDelay));
  ok(Math.min(...delays) >= 1.77,
     `the rain waits for the span to connect (earliest ${Math.min(...delays)}s)`);
  ok(new Set(delays).size >= rays.length * 0.5,
     `and starts staggered rather than as one sheet (${new Set(delays).size} distinct starts)`);

  /* The gate is built once and never taken down, so without this every one
     of those streaks goes on animating on every other face, out of sight.
     Two things make the pause take effect and both are easy to undo by
     accident: the rule has to come after the `animation` shorthand, which
     resets play-state, and it has to match its specificity. */
  d.getElementById('homeBtn').click();
  await wait(1400);
  const idle = rays.filter((r) => r.getAnimations().some((a) => a.playState === 'running'));
  ok(idle.length === 0,
     `the rain stops when its face is not the one on screen (${idle.length}/${rays.length} still running)`);
  key('ArrowLeft');
  await wait(1400);
  const live = rays.filter((r) => r.getAnimations().some((a) => a.playState === 'running'));
  ok(live.length === rays.length, `and picks up again on arrival (${live.length}/${rays.length})`);

  const dAttr = beam.getAttribute('d');
  ok(/^M[\d\s.]+L[\d\s.]+$/.test(dAttr.trim()), `the beam is a straight run (${dAttr})`);

  /* The design space reached the long way round, and its bar pressed without
     the cube moving under it: the face is a drag surface, so a control sitting
     on one has to swallow the press rather than pass it through. */
  d.getElementById('homeBtn').click();
  await wait(1200);
  key('ArrowRight'); await wait(950); key('ArrowRight'); await wait(1200);
  ok(hud() === LABELS.back, 'arrived at the design space');
  const kbar = d.getElementById('keenHandle');
  const poseBeforePress = face('front').style.transform;
  kbar.click();
  await wait(250);
  ok(kbar.getAttribute('aria-pressed') === 'true', 'the bar reads on a press');
  ok(face('front').style.transform === poseBeforePress,
     'and pressing it does not turn the cube under it');
  kbar.click();
  await wait(150);

  /* ---------- the greeting, in a page of its own ------------------------
     The greeting fires once, seconds after load, and this harness has been
     driving the page for a minute by now — so it gets a fresh frame rather
     than an assertion about something long gone. */

  log('\n— cpt greeting —');
  const f2 = document.createElement('iframe');
  f2.style.cssText = 'width:1280px;height:800px;border:1px solid #ddd';
  document.body.appendChild(f2);
  await new Promise((r) => { f2.addEventListener('load', r, {once: true}); f2.src = '../index.html'; });
  const w2 = f2.contentWindow, d2 = f2.contentDocument;
  /* The greeting does not speak. It is the first thing that happens on a page
     nobody has asked anything of yet, and it is also the utterance an engine
     is least ready for — so counting what reaches the engine while it plays
     is the cheapest way to keep it that way. Warm-up is silent by design and
     is exempt: it is volume 0 and carries no words. */
  const spokenAloud = [];
  if (w2.speechSynthesis) {
    w2.speechSynthesis.speak = (u) => { if (u && u.volume !== 0) spokenAloud.push(u.text || ''); };
    w2.speechSynthesis.cancel = () => {};
  }

  let maxAlive = 0, sawOut = false, seen = new Set();
  for (let i = 0; i < 95; i++) {
    const all = [...d2.querySelectorAll('.ghost-line')];
    maxAlive = Math.max(maxAlive, all.filter((n) => !n.classList.contains('out')).length);
    if (all.some((n) => n.classList.contains('out'))) sawOut = true;
    all.forEach((n) => { if (n.textContent) seen.add(n.textContent); });
    await wait(120);
  }
  ok(maxAlive > 1, `the greeting arrives as lines, not one block (${maxAlive} at once)`);
  ok(maxAlive === 3, `never more than three on screen (peak ${maxAlive})`);
  ok(sawOut, 'and the oldest is retired once a fourth starts');
  // the longest completed line, to catch copy that has outgrown the bubble
  const longest = [...seen].reduce((a, b) => (b.length > a.length ? b : a), '');
  ok(longest.length <= 40, `no line outgrows the bubble (longest ${longest.length} chars)`);
  ok(spokenAloud.length === 0,
     `and the welcome says it without speaking (${spokenAloud.length} utterances)`);

  /* Walking into the design space while the welcome is still going must
     switch to the design space mid-sentence — the greeting is NOT dismissed
     first here, on purpose. Newest ambient line wins. */
  const key2 = (k) => w2.dispatchEvent(new w2.KeyboardEvent('keydown', {key: k, bubbles: true}));
  ok(d2.getElementById('ghostMsg').classList.contains('show'),
     'the welcome is still going when we walk out of the room');
  key2('ArrowRight'); await wait(1000);
  key2('ArrowRight'); await wait(3100);
  const introLines = [...d2.querySelectorAll('.ghost-line')].map((n) => n.textContent).join(' ');
  ok(/디자인 공간/.test(introLines),
     `the design space takes the floor from the welcome (${introLines.slice(0, 30)})`);
  ok(!/안내 에이전트/.test(introLines), 'and the welcome is gone rather than queued behind it');
  // …once. Walking back in should not start the tour again.
  d2.getElementById('ghostMsg').click();
  await wait(700);
  d2.getElementById('homeBtn').click(); await wait(1400);
  key2('ArrowRight'); await wait(1000);
  key2('ArrowRight'); await wait(2400);
  ok(!d2.getElementById('ghostMsg').classList.contains('show'),
     'and does not say it again on the way back in');
  await wait(700);
  ok(d2.querySelectorAll('.ghost-line').length === 0,
     'a dismissed answer is emptied, not just hidden — invisible text is still text');
  /* ...and empties the CONTENT only. The bubble is made of the same liquid
     glass as everything else, which means it carries a layer to light, and
     the old textContent = '' deleted that along with the words. */
  ok(!!d2.getElementById('ghostMsg').querySelector(':scope > .liquid-lens'),
     'and emptying it does not take its glass with it');

  /* A fresh page for the rest. Reaching keen above took two turns, and the
     first of them lands on the portfolio — which introduced itself in
     passing and is now marked as said. Correct behaviour, but it means the
     room checks have to start from a page that has not been walked through.
     Each room below is ONE turn from the front face for the same reason. */
  await new Promise((r) => { f2.addEventListener('load', r, {once: true}); f2.src = '../index.html'; });
  const w3 = f2.contentWindow, d3 = f2.contentDocument;
  if (w3.speechSynthesis) { w3.speechSynthesis.speak = () => {}; w3.speechSynthesis.cancel = () => {}; }
  const rf3 = w3.fetch;
  w3.fetch = (u, o) => (String(u).includes('/chat/') ? Promise.reject(new Error('offline')) : rf3.call(w3, u, o));
  const key3 = (k) => w3.dispatchEvent(new w3.KeyboardEvent('keydown', {key: k, bubbles: true}));
  const roomText = () => [...d3.querySelectorAll('.ghost-line')].map((n) => n.textContent).join(' ');
  await wait(4200);                                   // let the welcome start

  // the rooms that have something to say, say it; the unfinished ones stay quiet
  for (const [k, want, label] of [['ArrowRight', /작업 기록/, 'portfolio'],
                                  ['ArrowLeft', /건너가는 다리/, 'Bifröst']]) {
    d3.getElementById('ghostMsg').click();
    await wait(700);
    d3.getElementById('homeBtn').click(); await wait(1500);
    key3(k); await wait(3500);
    ok(want.test(roomText()), `${label} introduces itself (${roomText().slice(0, 24)})`);
  }
  for (const [k, label] of [['ArrowUp', 'prospect'], ['ArrowDown', 'minimalid']]) {
    d3.getElementById('ghostMsg').click();
    await wait(900);
    d3.getElementById('homeBtn').click(); await wait(1500);
    key3(k); await wait(2800);
    ok(!d3.getElementById('ghostMsg').classList.contains('show'),
       `${label} stays quiet — nothing settled to say yet`);
  }

  /* The other half of the priority rule: something the visitor ASKED for is
     not talked over by a room introducing itself. keen has not been reached
     on this page, so it is the one room still holding an introduction. */
  d3.getElementById('ghostMsg').click();
  await wait(700);
  d3.getElementById('homeBtn').click(); await wait(1500);
  d3.getElementById('chatInput').value = 'GOvision이 뭐야?';
  d3.getElementById('chatForm').dispatchEvent(new w3.Event('submit', {bubbles: true, cancelable: true}));
  await wait(1200);
  const answer = [...d3.querySelectorAll('.ghost-line')].map((n) => n.textContent).join(' ');
  ok(answer.length > 0, 'an answer is on screen');
  key3('ArrowRight'); await wait(1000);
  key3('ArrowRight'); await wait(2400);
  const stillThere = [...d3.querySelectorAll('.ghost-line')].map((n) => n.textContent).join(' ');
  ok(!/디자인 공간/.test(stillThere),
     'a room does not talk over an answer the visitor asked for');
  f2.remove();

  log(fails?`\n${fails} FAILURES`:'\nALL PASS');
  log('DONE');
});
</script>
</body></html>
